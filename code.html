<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisioPro</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* GLOBAL */
        :root {
            --primary-color: #6C63FF;
            --primary-light: #8B85FF;
            --primary-dark: #5A52D5;
            --accent-color: #FF6584;
            --text-light: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.35);
            --glass-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --success-color: #22c55e;
            --error-color: #ff4d4d;
            --warning-color: #ffb020;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        html { scroll-behavior: smooth; }

        body {
            background: url("image.png") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: -1;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(circle at 20% 80%, rgba(108, 99, 255, 0.18) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 101, 132, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        .floating-elements {
            position: fixed;
            width: 100%; height: 100%;
            top: 0; left: 0;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .floating-element {
            position: absolute;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }

        .floating-element:nth-child(1) { width: 80px; height: 80px; top: 10%; left: 10%; animation-delay: 0s; }
        .floating-element:nth-child(2) { width: 120px; height: 120px; top: 70%; left: 80%; animation-delay: -5s; }
        .floating-element:nth-child(3) { width: 60px; height: 60px; top: 20%; left: 85%; animation-delay: -10s; }
        .floating-element:nth-child(4) { width: 100px; height: 100px; top: 80%; left: 15%; animation-delay: -7s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(120deg); }
            66% { transform: translateY(10px) rotate(240deg); }
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 30px;
            margin-bottom: 30px;
            position: relative;
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            animation: logoPop 0.6s ease-out;
        }

        @keyframes logoPop {
            from { opacity: 0; transform: translateY(-12px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-container img {
            height: 50px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .logo-container h1 {
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            background: linear-gradient(90deg, var(--text-light), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            margin: auto;
            animation: fadeIn 0.7s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            z-index: 10;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-box {
            background: var(--glass-bg);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            padding: 42px 40px;
            border-radius: 26px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }

        .login-box::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
        }

        .login-box:hover::before { opacity: 1; }
        .login-box:hover { transform: translateY(-4px); box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3); }

        .lock-icon-wrap {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(108, 99, 255, 0.45);
        }

        .lock-icon-wrap i { color: #fff; font-size: 1.6rem; }

        h2 {
            text-align: center;
            color: var(--text-light);
            font-size: 1.7rem;
            margin-bottom: 6px;
            font-weight: 600;
            text-shadow: 0 0 6px rgba(0,0,0,0.25);
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-bottom: 28px;
        }

        label {
            color: var(--text-light);
            font-size: 0.85rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 500;
        }

        .caps-lock-warning {
            color: var(--warning-color);
            font-size: 0.72rem;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 4px;
        }
        .caps-lock-warning.visible { display: flex; }

        .input-group { margin-bottom: 22px; }

        .input-field {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.16);
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            border-radius: 15px;
            padding: 0 15px;
            backdrop-filter: blur(8px);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .input-field.field-error { border-color: var(--error-color); box-shadow: 0 0 0 3px rgba(255, 77, 77, 0.18); }
        .input-field.field-valid { border-color: var(--success-color); }

        .input-field::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s ease;
            pointer-events: none;
        }

        .input-field:focus-within::before { left: 100%; }

        .input-field input {
            flex: 1;
            padding: 14px 0;
            background: none;
            border: none;
            outline: none;
            color: var(--text-light);
            font-size: 1rem;
        }

        .input-field input::placeholder { color: var(--text-muted); }
        .input-field i { color: var(--text-light); font-size: 1rem; margin-right: 10px; transition: var(--transition); flex-shrink: 0; }
        .input-field:focus-within { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.3); transform: translateY(-1px); }
        .input-field:focus-within i:first-child { color: var(--primary-light); }

        .toggle-password { cursor: pointer; transition: var(--transition); padding: 4px; margin-right: -4px !important; }
        .toggle-password:hover { color: var(--primary-light); transform: scale(1.15); }

        .login-button {
            width: 100%;
            padding: 16px;
            border-radius: 20px;
            border: none;
            color: var(--text-light);
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.02em;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(108, 99, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s ease;
        }

        .login-button:hover::before { left: 100%; }
        .login-button:hover:not(.disabled) { transform: translateY(-3px); box-shadow: 0 8px 22px rgba(108, 99, 255, 0.6); }
        .login-button:active:not(.disabled) { transform: translateY(0) scale(0.98); }
        .login-button.disabled { opacity: 0.55; cursor: not-allowed; pointer-events: none; box-shadow: none; }
        .login-button.loading { pointer-events: none; }

        #message {
            margin-top: 16px;
            padding: 12px 14px;
            font-size: 0.87rem;
            border-radius: 12px;
            text-align: center;
            display: none;
            backdrop-filter: blur(10px);
            animation: slideDown 0.3s ease-out;
            line-height: 1.4;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-message { background: rgba(255, 77, 77, 0.18); color: #ff8080; border: 1px solid rgba(255, 77, 77, 0.35); }
        .success-message { background: rgba(34, 197, 94, 0.18); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.35); }
        .warning-message { background: rgba(255, 176, 32, 0.18); color: #ffc857; border: 1px solid rgba(255, 176, 32, 0.35); }

        .welcome-message {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            padding: 40px 55px;
            border-radius: 28px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            z-index: 1000;
            text-align: center;
            animation: fadeInScale 0.45s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: none;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.85); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .welcome-message i {
            font-size: 60px;
            color: var(--primary-light);
            margin-bottom: 18px;
            display: inline-block;
            animation: iconBounce 0.6s ease-out 0.15s both;
        }

        @keyframes iconBounce {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); }
        }

        .welcome-message h3 { color: var(--text-light); font-size: 1.7rem; margin-bottom: 12px; font-weight: 600; }
        .welcome-message p { color: var(--text-muted); font-size: 1rem; }
        .welcome-message .user-name { color: var(--accent-color); font-weight: 700; font-size: 1.25rem; margin-top: 8px; }

        .welcome-progress {
            margin-top: 18px;
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
        }
        .welcome-progress-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--primary-light), var(--accent-color));
            transform-origin: left;
            animation: shrinkBar 3s linear forwards;
        }
        @keyframes shrinkBar { from { transform: scaleX(1); } to { transform: scaleX(0); } }

        .welcome-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(6px);
            z-index: 999;
            display: none;
            animation: overlayFade 0.3s ease-out;
        }
        @keyframes overlayFade { from { opacity: 0; } to { opacity: 1; } }

        .countdown-timer {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--accent-color);
            margin-top: 12px;
            text-align: center;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
        }

        footer.page-footer {
            text-align: center;
            padding: 18px 0 4px;
            color: var(--text-muted);
            font-size: 0.78rem;
            position: relative;
            z-index: 10;
        }

        @media (max-width: 768px) {
            header { padding: 10px 20px; margin-bottom: 24px; }
            .login-box { padding: 32px 26px; }
            h2 { font-size: 1.5rem; }
            .welcome-message { padding: 30px 40px; width: 88%; }
            .welcome-message h3 { font-size: 1.4rem; }
            .welcome-message i { font-size: 48px; }
        }

        @media (max-width: 480px) {
            .logo-container h1 { font-size: 1.5rem; }
            .login-box { padding: 26px 20px; }
            h2 { font-size: 1.35rem; }
            .welcome-message { padding: 25px 26px; }
            .welcome-message h3 { font-size: 1.25rem; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-6px); }
            20%, 40%, 60%, 80% { transform: translateX(6px); }
        }
        .shake { animation: shake 0.45s cubic-bezier(.36,.07,.19,.97) both; }

        input:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Focus visible pour accessibilité clavier */
        a:focus-visible, button:focus-visible, input:focus-visible, i.toggle-password:focus-visible {
            outline: 2px solid var(--primary-light);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }

.lock-icon-wrap { overflow: hidden; }
.lock-icon-logo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
}
.lock-icon-wrap i { display: none; align-items: center; justify-content: center; width: 100%; height: 100%; }
    </style>
</head>

<body>
    <div class="floating-elements" aria-hidden="true">
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
    </div>

    <div class="welcome-overlay" id="welcomeOverlay"></div>
    <div class="welcome-message" id="welcomeMessage" role="status" aria-live="polite">
        <i class="fas fa-user-circle"></i>
        <h3>Bonjour</h3>
        <div class="user-name" id="userNameDisplay"></div>
        <p>Bienvenue sur VisioPro</p>
        <div class="welcome-progress"><div class="welcome-progress-fill" id="welcomeProgressFill"></div></div>
    </div>

    <div class="login-container">
        <div class="login-box">
            <div class="lock-icon-wrap" aria-hidden="true">
    <img src="logoAppli.png" alt="" class="lock-icon-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <i class="fas fa-shield-halved" style="display:none;"></i>
</div>
            <h2>VisioPro</h2>
            

            <form id="login-form" novalidate>
                <div class="input-group">
                    <div class="input-field" id="usernameField">
                        <i class="fa fa-user" aria-hidden="true"></i>
                        <input type="text" id="username" placeholder="Entrez votre nom" required autocomplete="username" aria-required="true">
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">
                        <span class="caps-lock-warning" id="capsLockWarning"><i class="fas fa-triangle-exclamation"></i> Verr. Maj activé</span>
                    </label>
                    <div class="input-field" id="passwordField">
                        <i class="fa fa-lock" aria-hidden="true"></i>
                        <input type="password" id="password" placeholder="Mot de passe" required autocomplete="current-password" aria-required="true">
                        <i class="fa fa-eye toggle-password" id="togglePassword" tabindex="0" role="button" aria-label="Afficher le mot de passe"></i>
                    </div>
                </div>

                <button type="submit" class="login-button" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> <span id="loginBtnText">Connexion</span>
                </button>

                <div id="message" role="alert"></div>
                <div id="countdownDisplay" class="countdown-timer" style="display: none;" role="status" aria-live="polite"></div>
            </form>
        </div>
    </div>

    <footer class="page-footer">© VisioPro — Accès réservé au personnel autorisé</footer>

    <script>
        // ==================== CONFIGURATION ====================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwR8XauCznWasiPNbX3OXcihLFYDT_iDYnvPHCn0md3fA_SlzSR2vvT3H6w9CheVfzY/exec';

        // ==================== FONCTIONS DE SÉCURITÉ ====================

        function sanitizeInput(input) {
            if (!input) return '';
            return String(input)
                .replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                })
                .substring(0, 255);
        }

        function isValidUsername(username) {
            const validPattern = /^[a-zA-Z0-9_@.\-]{3,50}$/;
            return validPattern.test(username);
        }

        // ==================== GESTION DU TOKEN ====================

        function getApiToken() {
            return sessionStorage.getItem('apiToken');
        }

        function setApiToken(token) {
            if (token) sessionStorage.setItem('apiToken', token);
        }

        function clearApiToken() {
            sessionStorage.removeItem('apiToken');
            sessionStorage.removeItem('utilisateur');
            sessionStorage.removeItem('isAdmin');
            sessionStorage.removeItem('hasCaisseAccess');
            sessionStorage.removeItem('agence');
            sessionStorage.removeItem('analyse');
        }


        async function apiCall(action, data = {}) {
            const token = getApiToken();

            if (!token && action !== 'login') {
                console.error('❌ Pas de token, redirection vers login');
                window.location.href = 'index.html';
                throw new Error('Non authentifié');
            }

            const params = new URLSearchParams();
            params.append('action', action);

            if (token) params.append('token', token);

            for (const [key, value] of Object.entries(data)) {
                if (value !== undefined && value !== null) {
                    if (typeof value === 'object') {
                        params.append(key, JSON.stringify(value));
                    } else {
                        params.append(key, String(value));
                    }
                }
            }

            const url = `${SCRIPT_URL}?${params.toString()}`;

            const logUrl = url.replace(/password=[^&]*/, 'password=***');
            console.log(`📡 API Call (GET): ${action}`, logUrl);

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-cache'
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const result = await response.json();

                if (!result.success && result.message && result.message.includes('Session')) {
                    console.warn('⚠️ Session expirée, redirection');
                    clearApiToken();
                    window.location.href = 'index.html';
                }

                return result;

            } catch (error) {
                console.error(`❌ Erreur API ${action}:`, error);
                return {
                    success: false,
                    message: 'Erreur de connexion au serveur',
                    errorDetails: error.message
                };
            }
        }


        const STORAGE_KEY = "visiopro_login_block";
        const MAX_ATTEMPTS = 3;
        const BLOCK_DURATION_MS = 60 * 1000;

        let blockData = null;
        let countdownInterval = null;

        function initBlockSystem() {
            const stored = localStorage.getItem(STORAGE_KEY);
            const now = Date.now();

            if (stored) {
                try {
                    blockData = JSON.parse(stored);
                    if (blockData.isBlocked) {
                        const remaining = blockData.blockedUntil - now;
                        if (remaining > 0) {
                            activateBlockade(remaining);
                            return;
                        } else {
                            resetBlockState();
                        }
                    } else {
                        const lastAttemptTime = blockData.lastAttemptTime || 0;
                        if (now - lastAttemptTime > 3600000) resetBlockState();
                    }
                } catch(e) { resetBlockState(); }
            } else {
                resetBlockState();
            }
        }

        function resetBlockState() {
            blockData = { attempts: 0, isBlocked: false, blockedUntil: null, lastAttemptTime: null };
            saveBlockState();
        }

        function saveBlockState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(blockData));
        }

        function registerFailedAttempt() {
            if (blockData.isBlocked) return false;
            blockData.attempts++;
            blockData.lastAttemptTime = Date.now();

            if (blockData.attempts >= MAX_ATTEMPTS) {
                blockData.isBlocked = true;
                blockData.blockedUntil = Date.now() + BLOCK_DURATION_MS;
                saveBlockState();
                activateBlockade(BLOCK_DURATION_MS);
                return true;
            }
            saveBlockState();
            return false;
        }

        function activateBlockade(remainingMs) {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const messageDiv = document.getElementById('message');
            const countdownDiv = document.getElementById('countdownDisplay');

            usernameInput.disabled = true;
            passwordInput.disabled = true;
            loginBtn.disabled = true;
            loginBtn.classList.add('disabled');

            const secondsRemaining = Math.ceil(remainingMs / 1000);
            messageDiv.textContent = `⛔ Trop de tentatives échouées. Accès bloqué pour ${secondsRemaining} secondes.`;
            messageDiv.className = 'warning-message';
            messageDiv.style.display = 'block';
            countdownDiv.style.display = 'block';

            if (countdownInterval) clearInterval(countdownInterval);

            let remaining = remainingMs;
            countdownInterval = setInterval(() => {
                remaining -= 1000;
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    resetBlockState();
                    deactivateBlockade();
                } else {
                    const secs = Math.ceil(remaining / 1000);
                    countdownDiv.textContent = `⏱️ Accès bloqué. Réessayez dans ${secs} secondes...`;
                }
            }, 1000);
        }

        function deactivateBlockade() {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const messageDiv = document.getElementById('message');
            const countdownDiv = document.getElementById('countdownDisplay');

            usernameInput.disabled = false;
            passwordInput.disabled = false;
            loginBtn.disabled = false;
            loginBtn.classList.remove('disabled');
            messageDiv.style.display = 'none';
            countdownDiv.style.display = 'none';

            if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
        }

        function isAccessBlocked() {
            if (blockData && blockData.isBlocked) {
                if (Date.now() < blockData.blockedUntil) return true;
                resetBlockState();
                deactivateBlockade();
                return false;
            }
            return false;
        }

        // ==================== FONCTIONS PRINCIPALES ====================

        const form = document.getElementById('login-form');
        const message = document.getElementById('message');
        const togglePassword = document.getElementById('togglePassword');
        const passwordInputField = document.getElementById('password');
        const usernameInputField = document.getElementById('username');
        const usernameFieldWrap = document.getElementById('usernameField');
        const passwordFieldWrap = document.getElementById('passwordField');
        const welcomeMessageDiv = document.getElementById('welcomeMessage');
        const welcomeOverlay = document.getElementById('welcomeOverlay');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const welcomeProgressFill = document.getElementById('welcomeProgressFill');
        const capsLockWarning = document.getElementById('capsLockWarning');

        function showWelcomeMessage(username) {
            const safeUsername = sanitizeInput(username);
            userNameDisplay.textContent = safeUsername;
            welcomeOverlay.style.display = 'block';
            welcomeMessageDiv.style.display = 'block';
            welcomeProgressFill.style.animation = 'none';
            void welcomeProgressFill.offsetWidth; // relance l'animation
            welcomeProgressFill.style.animation = 'shrinkBar 3s linear forwards';

            setTimeout(() => {
                welcomeMessageDiv.style.animation = 'fadeInScale 0.3s reverse';
                setTimeout(() => {
                    welcomeMessageDiv.style.display = 'none';
                    welcomeOverlay.style.display = 'none';
                    welcomeMessageDiv.style.animation = '';
                }, 300);
            }, 3000);
        }

        if (togglePassword) {
            const togglePasswordVisibility = function() {
                const type = passwordInputField.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInputField.setAttribute('type', type);
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
                this.setAttribute('aria-label', type === 'password' ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
                passwordInputField.focus();
            };
            togglePassword.addEventListener('click', togglePasswordVisibility);
            togglePassword.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); togglePasswordVisibility.call(this); }
            });
        }

        // Détection Verrouillage Majuscules
        passwordInputField.addEventListener('keyup', function(e) {
            if (typeof e.getModifierState === 'function') {
                const isCaps = e.getModifierState('CapsLock');
                capsLockWarning.classList.toggle('visible', isCaps);
            }
        });
        passwordInputField.addEventListener('blur', () => capsLockWarning.classList.remove('visible'));

        // Efface l'état d'erreur dès que l'utilisateur retape
        function clearFieldState(wrap) {
            wrap.classList.remove('field-error');
        }
        usernameInputField.addEventListener('input', () => {
            clearFieldState(usernameFieldWrap);
            if (message.style.display === 'block' && message.className.includes('error')) message.style.display = 'none';
        });
        passwordInputField.addEventListener('input', () => {
            clearFieldState(passwordFieldWrap);
            if (message.style.display === 'block' && message.className.includes('error')) message.style.display = 'none';
        });

        // Formulaire de connexion
        if (form) {
            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                if (isAccessBlocked()) {
                    message.textContent = "⛔ Accès temporairement bloqué. Veuillez patienter.";
                    message.className = 'warning-message';
                    message.style.display = 'block';
                    return;
                }

                const username = sanitizeInput(usernameInputField.value.trim());
                const password = passwordInputField.value.trim();

                if (!username || !password) {
                    message.textContent = "Veuillez remplir tous les champs.";
                    message.className = 'error-message';
                    message.style.display = 'block';
                    if (!username) usernameFieldWrap.classList.add('field-error');
                    if (!password) passwordFieldWrap.classList.add('field-error');
                    form.classList.add('shake');
                    setTimeout(() => form.classList.remove('shake'), 450);
                    return;
                }

                if (!isValidUsername(username)) {
                    message.textContent = "Nom d'utilisateur invalide (3-50 caractères)";
                    message.className = 'error-message';
                    message.style.display = 'block';
                    usernameFieldWrap.classList.add('field-error');
                    return;
                }

                const submitBtn = form.querySelector('button[type="submit"]');
                const loginBtnText = document.getElementById('loginBtnText');
                const originalBtnHTML = submitBtn.innerHTML;
                submitBtn.classList.add('loading');
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Connexion...</span>';
                submitBtn.disabled = true;
                message.style.display = 'none';

                try {
                    const result = await apiCall('login', {
                        username: username,
                        password: password
                    });

                    if (result.success && result.data && result.data.token) {
                        setApiToken(result.data.token);
                        sessionStorage.setItem("utilisateur", username);
                        sessionStorage.setItem("isAdmin", result.data.isAdmin ? "true" : "false");
                        sessionStorage.setItem("hasCaisseAccess", result.data.hasCaisseAccess ? "true" : "false");
                        sessionStorage.setItem("agence", result.data.agence || "");
                        sessionStorage.setItem("analyse", result.data.analyse || "");

                        resetBlockState();
                        deactivateBlockade();
                        showWelcomeMessage(username);

                        submitBtn.innerHTML = '<i class="fas fa-check"></i> <span>Connecté</span>';
                        message.textContent = 'Connexion réussie ! Redirection...';
                        message.className = 'success-message';
                        message.style.display = 'block';
                        usernameFieldWrap.classList.add('field-valid');
                        passwordFieldWrap.classList.add('field-valid');

                        setTimeout(() => { window.location.href = 'Accueil.html'; }, 2000);

                    } else {
                        const wasBlocked = registerFailedAttempt();
                        const remainingAttempts = MAX_ATTEMPTS - blockData.attempts;

                        usernameFieldWrap.classList.add('field-error');
                        passwordFieldWrap.classList.add('field-error');

                        if (wasBlocked) {
                            message.textContent = "⛔ 3 tentatives échouées. Accès bloqué 1 minute.";
                            message.className = 'warning-message';
                        } else {
                            message.textContent = result.message || 'Identifiants incorrects.';
                            message.className = 'error-message';

                            if (remainingAttempts > 0 && remainingAttempts < MAX_ATTEMPTS) {
                                setTimeout(() => {
                                    if (message.textContent.includes('incorrects')) {
                                        message.textContent = `⚠️ Il reste ${remainingAttempts} tentative(s) avant blocage.`;
                                        message.className = 'warning-message';
                                        setTimeout(() => {
                                            if (message.textContent.includes('reste')) message.style.display = 'none';
                                        }, 3000);
                                    }
                                }, 1500);
                            }
                        }
                        message.style.display = 'block';
                        form.classList.add('shake');
                        setTimeout(() => form.classList.remove('shake'), 500);
                    }

                } catch (error) {
                    console.error('Erreur:', error);
                    message.textContent = "Erreur de connexion au serveur.";
                    message.className = 'error-message';
                    message.style.display = 'block';
                } finally {
                    submitBtn.classList.remove('loading');
                    submitBtn.innerHTML = originalBtnHTML;
                    if (!blockData.isBlocked) submitBtn.disabled = false;
                }
            });
        }

        // Initialisation
        console.log('=== APPLICATION SÉCURISÉE DÉMARRÉE ===');
        initBlockSystem();

        if (isAccessBlocked() && blockData && blockData.blockedUntil) {
            const remaining = blockData.blockedUntil - Date.now();
            if (remaining > 0) activateBlockade(remaining);
        }

        if (blockData && blockData.attempts > 0 && blockData.attempts < MAX_ATTEMPTS && !blockData.isBlocked) {
            const remaining = MAX_ATTEMPTS - blockData.attempts;
            message.textContent = `⚠️ Attention : ${remaining} tentative(s) restante(s) avant blocage.`;
            message.className = 'warning-message';
            message.style.display = 'block';
            setTimeout(() => {
                if (message.textContent.includes('restante')) message.style.display = 'none';
            }, 5000);
        }

        // Autofocus sur le champ nom d'utilisateur si non bloqué
        if (!(blockData && blockData.isBlocked)) {
            usernameInputField.focus();
        }

        console.log('=== APPLICATION PRÊTE ===');
    </script>
</body>
</html>
