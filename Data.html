        </div>

        <!-- CARTES SYNTHÈSE -->
        <div class="summary-cards" id="summaryCards"></div>

        <!-- BULK ACTIONS -->
        <div class="bulk-actions" id="bulkActions">
            <span class="selected-count" id="selectedCount">0</span> client(s) sélectionné(s)
            <button class="bulk-action-btn" onclick="prepareCommande()">
                <i class="fas fa-shopping-cart"></i> Préparer Commande
            </button>
            <button class="bulk-action-btn delete" onclick="clearSelection()">
                <i class="fas fa-times"></i> Désélectionner tout
            </button>
        </div>

        <!-- TABLE -->
        <div class="table-container">
            <div class="table-wrapper">
                <table class="clients-table">
                    <thead>
                        <tr>
                            <th class="checkbox-cell">
                                <input type="checkbox" class="select-all-checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)">
                            </th>
                            <th>Client</th>
                            <th>Contact</th>
                            <th>Agence</th>
                            <th>Commercial</th>
                            <th>Montant</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="clientsTableBody">
                        <tr><td colspan="8"><div class="loading-indicator"><div class="spinner-border"></div><div>Chargement des clients...</div></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="section-message" class="alert-message" style="display:none;"></div>
    </div>

    <!-- ============================================================
         MODALES
    ============================================================ -->

    <!-- MODALE DÉTAIL CLIENT -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content xlarge-modal">
            <div class="modal-header">
                <h3 class="modal-title"><i class="fas fa-user-circle"></i> Fiche Client</h3>
                <button class="modal-close" onclick="fermerDetailModal()">&times;</button>
            </div>
            <div class="modal-body" id="detailModalBody"></div>
        </div>
    </div>

    <!-- LOADING OVERLAY -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border"></div>
        <div class="loading-text">Traitement en cours...</div>
    </div>

    <!-- CONTAINERS -->
    <div id="modal-container"></div>
    <div id="custom-confirm-container"></div>
    <div class="print-section" id="printSection"></div>

    <!-- ============================================================
         JAVASCRIPT (VOTRE CODE ORIGINAL CONSERVÉ)
    ============================================================ -->
    <script>
        // ==================== CONFIGURATION ====================
        const CONFIG = {
            API_URL: 'https://script.google.com/macros/s/AKfycbwR8XauCznWasiPNbX3OXcihLFYDT_iDYnvPHCn0md3fA_SlzSR2vvT3H6w9CheVfzY/exec',
            SESSION_KEYS: {
                USER: 'utilisateur',
                TOKEN: 'apiToken'
            },
            INACTIVITY_TIMEOUT: 30 * 60 * 1000,
            STATUS_COLORS: {
                'nouvelle vente': '#667eea',
                'en traitement': '#f59e0b',
                'reçu boutique': '#3b82f6',
                'livré': '#10b981',
                'cancel': '#ef4444',
                'commande passée': '#8b5cf6',
                'réceptionné': '#14b8a6',
                'default': '#6b7280'
            },
            STATUS_CARD_COLORS: [
                ['#3b82f6', '#60a5fa'], ['#10b981', '#34d399'], ['#f59e0b', '#fbbf24'],
                ['#8b5cf6', '#a78bfa'], ['#ef4444', '#f87171'], ['#06b6d4', '#22d3ee'],
                ['#ec4899', '#f472b6'], ['#14b8a6', '#2dd4bf']
            ]
        };

        // ==================== GESTION DU TOKEN ====================
        const TokenManager = {
            getToken() {
                return sessionStorage.getItem(CONFIG.SESSION_KEYS.TOKEN) || localStorage.getItem(CONFIG.SESSION_KEYS.TOKEN);
            },
            getUser() {
                return sessionStorage.getItem(CONFIG.SESSION_KEYS.USER) || localStorage.getItem(CONFIG.SESSION_KEYS.USER) || 'Commercial';
            },
            isAuthenticated() {
                const token = this.getToken();
                return token && token !== 'undefined' && token !== 'null';
            },
            redirectToLogin() {
                sessionStorage.removeItem(CONFIG.SESSION_KEYS.TOKEN);
                sessionStorage.removeItem(CONFIG.SESSION_KEYS.USER);
                window.location.href = 'code.html';
            },
            check() {
                if (!this.isAuthenticated()) {
                    this.redirectToLogin();
                    return false;
                }
                return true;
            }
        };

        // ==================== API ====================
        const API = {
            async fetchData(action, params = {}) {
                if (!TokenManager.check()) return;
                const token = TokenManager.getToken();
                const url = new URL(CONFIG.API_URL);
                url.searchParams.set('action', action);
                url.searchParams.set('token', token);
                Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
                try {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    if (data.success === false) {
                        if (['Session expirée', 'Session invalide', 'Token invalide'].includes(data.message)) {
                            TokenManager.redirectToLogin();
                        }
                        throw new Error(data.message);
                    }
                    return data;
                } catch (error) {
                    console.error('GET Error:', error);
                    throw error;
                }
            },
            async postData(action, body) {
                if (!TokenManager.check()) return;
                const token = TokenManager.getToken();
                const user = TokenManager.getUser();
                const url = `${CONFIG.API_URL}?action=${action}`;
                try {
                    await fetch(url, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ...body, token: token, utilisateur: user, timestamp: new Date().toISOString() })
                    });
                    return { success: true, message: 'Envoyé' };
                } catch (error) {
                    console.error('POST Error:', error);
                    throw error;
                }
            }
        };

        // ==================== ÉTAT GLOBAL ====================
        const STATE = {
            clients: [],
            filtered: [],
            selected: new Set(),
            commandes: [],
            fournisseurs: [],
            typesCommande: {},
            typesCommandeParClient: new Map(),
            datesLivraison: new Map(),
            fournisseurSelectionne: null,
            statusFilter: null,
            toastId: 0,
            companyName: '',
            companyDetails: '',
            venteModal: null
        };

        // ==================== UTILITAIRES ====================
        const Utils = {
            escapeHtml: (s) => { if (!s) return ''; return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); },
            formatPhone: (s) => {
                if (!s) return '';
                let d = String(s).replace(/\D/g, '');
                if (d.length > 10) d = d.slice(-10);
                return d.length === 10 ? d.replace(/(\d{2})(?=\d)/g, '$1 ') : s;
            },
            cleanPhone: (p) => {
                if (!p) return null;
                let d = String(p).replace(/\D/g, '');
                if (d.length > 10) d = d.slice(-10);
                return d.length === 10 ? d : null;
            },
            getInitials: (name) => {
                if (!name) return '?';
                return name.split(' ').map(p => p.charAt(0)).join('').toUpperCase().substring(0, 2);
            },
            formatDateForInput: (dateStr) => {
                if (!dateStr) return '';
                try {
                    const date = new Date(dateStr);
                    if (!isNaN(date.getTime())) return date.toISOString().split('T')[0];
                    const parts = dateStr.split('/');
                    if (parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
                } catch (e) { /* ignore */ }
                return '';
            },
            formaterDateVersJJMMAAAA: (dateStr) => {
                if (!dateStr) return '-';
                try {
                    const date = new Date(dateStr);
                    if (!isNaN(date.getTime())) return `${date.getDate().toString().padStart(2, '0')}/${(date.getMonth() + 1).toString().padStart(2, '0')}/${date.getFullYear()}`;
                    if (dateStr.includes('/')) return dateStr;
                    return '-';
                } catch (e) { return dateStr; }
            },
            normalizeStatus: (s) => {
                if (!s?.trim()) return 'Nouvelle vente';
                const map = {
                    'nouvelle vente': 'Nouvelle vente',
                    'en traitement': 'En traitement',
                    'reçu boutique': 'Reçu boutique',
                    'livré': 'Livré',
                    'cancel': 'Cancel',
                    'annulé': 'Cancel',
                    'perdu': 'Cancel',
                    'fr traitement': 'En traitement',
                    'commande passée': 'Commande passée',
                    'réceptionné': 'Réceptionné'
                };
                return map[s.toLowerCase().trim()] || s;
            },
            parseDate: (ds) => {
                if (!ds) return null;
                try { const d = new Date(ds); if (!isNaN(d.getTime())) return d; } catch {}
                try { const p = ds.split('/'); if (p.length === 3) return new Date(p[2], p[1] - 1, p[0]); } catch {}
                return null;
            },
            cleanPhoneNumber: (phone) => {
                if (!phone) return '';
                return String(phone).replace(/\s+/g, '').replace(/^(\+?229|00229)/, '');
            },
            getStatusColor: (status) => CONFIG.STATUS_COLORS[status?.toLowerCase().trim()] || CONFIG.STATUS_COLORS.default
        };

        // ==================== TOAST ====================
        function showToast(msg, type = 'info', dur = 4000) {
            const c = document.getElementById('toast-container');
            const id = `toast-${STATE.toastId++}`;
            const icons = { success: 'check-circle', error: 'exclamation-circle', warning: 'exclamation-triangle', info: 'info-circle' };
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.id = id;
            t.innerHTML = `<i class="fas fa-${icons[type]}"></i><span>${Utils.escapeHtml(msg)}</span><button class="toast-close" onclick="closeToast('${id}')"><i class="fas fa-times"></i></button>`;
            c.appendChild(t);
            setTimeout(() => closeToast(id), dur);
        }

        function closeToast(id) {
            const t = document.getElementById(id);
            if (t) { t.style.animation = 'slideIn .3s ease reverse';
                setTimeout(() => t.remove(), 300); }
        }

        // ==================== CONFIRMATION ====================
        function customConfirm({ title, message, type = 'warning', confirmText = 'Confirmer', cancelText = 'Annuler' }) {
            return new Promise(resolve => {
                const container = document.getElementById('custom-confirm-container');
                const icons = { danger: 'fa-exclamation-triangle', warning: 'fa-exclamation-circle', info: 'fa-info-circle', success: 'fa-check-circle' };
                container.innerHTML = `
                    <div class="custom-confirm-overlay active" id="customConfirmOverlay">
                        <div class="custom-confirm-modal">
                            <div class="custom-confirm-header">
                                <div class="custom-confirm-icon ${type}"><i class="fas ${icons[type] || icons.warning}"></i></div>
                                <div class="custom-confirm-title">${title}</div>
                            </div>
                            <div class="custom-confirm-message">${message}</div>
                            <div class="custom-confirm-footer">
                                <button class="custom-confirm-btn custom-confirm-btn-cancel" id="customConfirmCancel">${cancelText}</button>
                                <button class="custom-confirm-btn custom-confirm-btn-confirm ${type}" id="customConfirmConfirm">${confirmText}</button>
                            </div>
                        </div>
                    </div>`;
                const overlay = document.getElementById('customConfirmOverlay');
                const close = result => { container.innerHTML = '';
                    resolve(result); };
                document.getElementById('customConfirmConfirm').onclick = () => close(true);
                document.getElementById('customConfirmCancel').onclick = () => close(false);
                overlay.onclick = e => { if (e.target === overlay) close(false); };
                const esc = e => { if (e.key === 'Escape') { close(false);
                        document.removeEventListener('keydown', esc); } };
                document.addEventListener('keydown', esc);
            });
        }

        async function confirmAction(message, type = 'warning') {
            return customConfirm({ title: type === 'danger' ? '⚠️ Action irréversible' : 'Confirmation', message, type, confirmText: type === 'danger' ? 'Supprimer' : 'Confirmer', cancelText: 'Annuler' });
        }

        // ==================== OVERLAY ====================
        function showOverlay() { document.getElementById('loadingOverlay').classList.add('active'); }

        function hideOverlay() { document.getElementById('loadingOverlay').classList.remove('active'); }

        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
            document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
        }

        function openVueGlobale() { window.location.href = 'Accueil.html'; }

        // ==================== DATE ====================
        function updateCurrentDate() {
            const now = new Date();
            const el = document.getElementById('current-date');
            if (el) {
                el.textContent = now.toLocaleDateString('fr-FR', {
                    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
                });
            }
        }

        // ==================== CHARGEMENT DONNÉES ====================
        async function loadClientsData() {
            showLoadingState();
            try {
                const result = await API.fetchData('dataclient');
                if (!result.success) throw new Error(result.message || "Erreur serveur");
                STATE.clients = processClientData(result.data);
                STATE.filtered = [...STATE.clients];
                buildStatusCards();
                updateAgencyFilter();
                updateStatusFilter();
                displayClients();
                showToast(`${STATE.clients.length} clients chargés`, 'success');
            } catch (err) {
                console.error("Erreur:", err);
                showToast("Erreur de chargement: " + err.message, 'error');
                showErrorState();
            }
        }

        function processClientData(data) {
            if (!data?.rows || !data?.headers) return [];
            const hm = {};
            data.headers.forEach((h, i) => { hm[h] = i; });
            return data.rows.map(row => ({
                id: row[hm["ID client"]] || '',
                fullName: row[hm["Nom Complet Client"]] || '',
                phone: row[hm["Numéro Contact"]] || '',
                agency: row[hm["Agence"]] || '',
                salesperson: row[hm["Commercial"]] || '',
                netAmount: row[hm["Net à Payer (FCFA)"]] || 0,
                status: Utils.normalizeStatus(row[hm["Statut de la vente"]] || 'Nouvelle vente'),
                registrationDate: Utils.parseDate(row[hm["Date Enregistrement"]])
            }));
        }

        async function chargerTypesCommande() {
            try {
                const result = await API.fetchData('commandefournisseurverre');
                if (result.success && result.data?.rows) {
                    STATE.typesCommande = {};
                    result.data.rows.forEach(row => {
                        const fournisseur = row[0]?.trim();
                        const typeCommande = row[1]?.trim();
                        if (fournisseur && typeCommande) {
                            if (!STATE.typesCommande[fournisseur]) STATE.typesCommande[fournisseur] = [];
                            if (!STATE.typesCommande[fournisseur].includes(typeCommande)) {
                                STATE.typesCommande[fournisseur].push(typeCommande);
                            }
                        }
                    });
                }
            } catch (error) {
                console.error('Erreur chargement types commande:', error);
            }
        }

        async function loadFournisseurs() {
            try {
                const result = await API.fetchData('fournisseur');
                STATE.fournisseurs = (result.success && result.data?.rows) ? result.data.rows.map(r => r[0]).filter(Boolean) : ['SIVO', 'Canada Optic', 'Zaih'];
            } catch { STATE.fournisseurs = ['SIVO', 'Canada Optic', 'Zaih']; }
        }

        async function loadCompanyInfo() {
            try {
                const result = await API.fetchData('infomonentreprise');
                if (result.success && result.data?.rows) {
                    const rows = result.data.rows;
                    if (rows[0]?.[0]) STATE.companyName = rows[0][0];
                    if (rows[1]?.[0]) STATE.companyDetails = rows[1][0];
                }
            } catch (error) {
                console.error('Erreur chargement infos entreprise:', error);
            }
        }

        // ==================== CARTES SYNTHÈSE ====================
        function buildStatusCards() {
            const container = document.getElementById('summaryCards');
            const statusCounts = {};
            STATE.clients.forEach(c => { statusCounts[c.status] = (statusCounts[c.status] || 0) + 1; });

            let html = '';
            // Carte Total
            const totalColor = CONFIG.STATUS_CARD_COLORS[0];
            html += `
                <div class="summary-card" onclick="resetStatusFilter()">
                    <div class="card-inner">
                        <div class="card-icon" style="background:linear-gradient(135deg,${totalColor[0]},${totalColor[1]});">
                            <i class="fas fa-users"></i>
                        </div>
                        <div class="card-info">
                            <div class="card-label">Total</div>
                            <div class="card-value">${STATE.clients.length}</div>
                        </div>
                    </div>
                </div>`;

            let idx = 1;
            Object.entries(statusCounts).forEach(([status, count]) => {
                const [c1, c2] = CONFIG.STATUS_CARD_COLORS[idx % CONFIG.STATUS_CARD_COLORS.length];
                const safeId = 'card-' + status.replace(/[^a-z0-9]/gi, '-').toLowerCase();
                html += `
                    <div class="summary-card filterable" id="${safeId}" onclick="filterByStatus('${status}')">
                        <div class="card-inner">
                            <div class="card-icon" style="background:linear-gradient(135deg,${c1},${c2});">
                                <i class="fas fa-circle"></i>
                            </div>
                            <div class="card-info">
                                <div class="card-label">${status}</div>
                                <div class="card-value">${count}</div>
                            </div>
                        </div>
                    </div>`;
                idx++;
            });
            container.innerHTML = html;
        }

        function filterByStatus(status) {
            STATE.statusFilter = status;
            document.getElementById('statusFilter').value = status;
            document.querySelectorAll('.summary-card.filterable').forEach(c => c.classList.remove('active-filter'));
            const el = document.getElementById('card-' + status.replace(/[^a-z0-9]/gi, '-').toLowerCase());
            if (el) el.classList.add('active-filter');
            applyFilters();
        }

        function resetStatusFilter() {
            STATE.statusFilter = null;
            document.getElementById('statusFilter').value = '';
            document.querySelectorAll('.summary-card').forEach(c => c.classList.remove('active-filter'));
            applyFilters();
        }

        function updateStatusFilter() {
            const el = document.getElementById('statusFilter');
            const statuses = [...new Set(STATE.clients.map(c => c.status))].sort();
            el.innerHTML = '<option value="">Tous les statuts</option>' + statuses.map(s => `<option value="${s}">${s}</option>`).join('');
        }

        function updateAgencyFilter() {
            const el = document.getElementById('agencyFilter');
            const agencies = [...new Set(STATE.clients.map(c => c.agency).filter(Boolean))].sort();
            el.innerHTML = '<option value="">Toutes les agences</option>' + agencies.map(a => `<option value="${Utils.escapeHtml(a)}">${Utils.escapeHtml(a)}</option>`).join('');
        }

        // ==================== FILTRES ====================
        let searchDebounceTimer;

        function debounceSearch() { clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(applyFilters, 300); }

        function applyFilters() {
            const term = (document.getElementById('searchInput').value || '').toLowerCase().trim();
            const status = document.getElementById('statusFilter').value;
            const agency = document.getElementById('agencyFilter').value;

            STATE.filtered = STATE.clients.filter(c => {
                const matchSearch = !term || c.fullName.toLowerCase().includes(term);
                return matchSearch && (!status || c.status === status) && (!agency || c.agency === agency);
            });

            clearSelection();
            displayClients();
        }

        // ==================== AFFICHAGE TABLE ====================
        function displayClients() {
            const tbody = document.getElementById('clientsTableBody');

            if (!STATE.filtered.length) {
                tbody.innerHTML = `<tr><td colspan="8"><div class="no-data"><i class="fas fa-search"></i>Aucun client trouvé</div></td></tr>`;
            } else {
                tbody.innerHTML = STATE.filtered.map((c, i) => {
                    const color = Utils.getStatusColor(c.status);
                    const amount = c.netAmount ? `${parseFloat(c.netAmount).toLocaleString('fr-FR')} FCFA` : '0 FCFA';
                    const checked = STATE.selected.has(c.id);
                    return `<tr style="animation-delay:${i * .02}s">
                        <td class="checkbox-cell" onclick="event.stopPropagation()"><input type="checkbox" class="client-checkbox" data-client-id="${c.id}" ${checked ? 'checked' : ''} onchange="toggleClientSelection(this,'${c.id}')"></td>
                        <td>
                            <div class="client-info-cell">
                                <div class="client-avatar">${Utils.getInitials(c.fullName)}</div>
                                <div>
                                    <div class="client-name">${Utils.escapeHtml(c.fullName) || 'Non renseigné'}</div>
                                    <div class="client-id">${c.id}</div>
                                </div>
                            </div>

                        <td>${Utils.escapeHtml(c.agency) || 'N/A'}</td>

                        <td style="font-weight:600;">${amount}</td>
                        <td><span class="status-badge" style="background:${color};">${c.status}</span></td>
                        <td>
                            <div class="action-btns" onclick="event.stopPropagation()">
                                <button class="action-btn btn-view" title="Voir détails" onclick="ouvrirDetailClient('${c.id}')"><i class="fas fa-eye"></i></button>
                                <button class="action-btn btn-call" title="Appeler" onclick="callClient('${c.phone}')"><i class="fas fa-phone"></i></button>
                                ${c.status !== 'Réceptionné' ? `<button class="action-btn btn-receive" title="Marquer réceptionné" onclick="markAsReceived('${c.id}')"><i class="fas fa-check-circle"></i></button>` : ''}

            updateSelectAllCheckbox();
        }

        // ==================== SÉLECTION ====================
        function toggleSelectAll(cb) {
            STATE.selected.clear();
            document.querySelectorAll('.client-checkbox').forEach(c => { c.checked = cb.checked; if (cb.checked) STATE.selected.add(c.dataset.clientId); });
            updateBulkActions();
        }

        function toggleClientSelection(cb, clientId) {
            cb.checked ? STATE.selected.add(clientId) : STATE.selected.delete(clientId);
            updateSelectAllCheckbox();
            updateBulkActions();
        }

        function updateSelectAllCheckbox() {
            const sa = document.getElementById('selectAllCheckbox');
            const all = document.querySelectorAll('.client-checkbox');
            const checked = document.querySelectorAll('.client-checkbox:checked').length;
            if (!sa) return;
            sa.indeterminate = checked > 0 && checked < all.length;
            sa.checked = all.length > 0 && checked === all.length;
        }

        function updateBulkActions() {
            const ba = document.getElementById('bulkActions');
            document.getElementById('selectedCount').textContent = STATE.selected.size;
            STATE.selected.size > 0 ? ba.classList.add('show') : ba.classList.remove('show');
        }

        function clearSelection() {
            STATE.selected.clear();
            document.querySelectorAll('.client-checkbox').forEach(c => c.checked = false);
            updateSelectAllCheckbox();
            updateBulkActions();
        }

        // ==================== SUPPRESSION CLIENT ====================
        async function deleteClient(clientId, clientName) {
            const confirmDelete = await confirmAction(
                `⚠️ Suppression définitive du client "${clientName}" (ID: ${clientId})\n\nCette action est irréversible !`,
                'danger'
            );
            if (!confirmDelete) return;

            try {
                showOverlay();
                const username = TokenManager.getUser();
                await API.postData('deleteclient', { clientId, utilisateur: username });

                STATE.clients = STATE.clients.filter(c => c.id !== clientId);
                STATE.filtered = STATE.filtered.filter(c => c.id !== clientId);
                STATE.selected.delete(clientId);
                buildStatusCards();
                updateAgencyFilter();
                updateStatusFilter();
                displayClients();
                updateBulkActions();
                showToast(`Client "${clientName}" supprimé avec succès`, 'success');
            } catch (error) {
                showToast("Erreur lors de la suppression", "error");
            } finally {
                hideOverlay();
            }
        }

        // ==================== RÉCEPTION ====================
        async function markAsReceived(clientId) {
            try {
                const client = STATE.clients.find(c => c.id === clientId);
                if (!client) { showToast("❌ Client non trouvé", "error"); return; }

                if (client.status !== "Commande passée") {
                    showToast(
                        `❌ Réception refusée : La commande du client "${client.fullName}" a le statut "${client.status}".\n` +
                        `Seules les commandes avec le statut "Commande passée" peuvent être réceptionnées.`,
                        'error'
                    );
                    return;
                }

                const ok = await confirmAction(
                    `📦 Confirmation de réception\n\nClient : ${client.fullName}\nID : ${clientId}\nStatut actuel : ${client.status}\n\nConfirmez-vous la réception de cette commande ?`,
                    'warning'
                );
                if (!ok) return;

                showOverlay();
                const username = TokenManager.getUser();
                const today = new Date().toISOString().split('T')[0];

                await API.postData('addpo', {
                    updates: [{
                        id: clientId,
                        ancienStatut: client.status,
                        nouveauStatut: "Réceptionné",
                        dateMiseAJour: today,
                        utilisateur: username,
                        fournisseur: '',
                        typeCommande: '',
                        dateLivraisonPrevue: today
                    }]
                });

                [STATE.clients, STATE.filtered].forEach(arr => {
                    arr.forEach(c => { if (c.id === clientId) c.status = "Réceptionné"; });
                });

                buildStatusCards();
                displayClients();
                updateStatusFilter();
                showToast(`✅ Commande de "${client.fullName}" marquée comme réceptionnée`, 'success');

            } catch (error) {
                console.error("Erreur lors de la réception:", error);
                showToast("❌ Erreur lors de la mise à jour du statut", "error");
            } finally {
                hideOverlay();
            }
        }

        // ==================== DÉTAIL CLIENT ====================
        async function ouvrirDetailClient(id) {
            showOverlay();
            try {
                const result = await API.fetchData('dataclient');
                if (result.success && result.data) {
                    const headers = result.data.headers;
                    const rows = result.data.rows;
                    const clientRow = rows.find(row => row[0] === id);
                    if (clientRow) {
                        const client = {};
                        headers.forEach((header, index) => { client[header] = clientRow[index] !== undefined ? clientRow[index] : ''; });
                        afficherDetailClient(client);
                        document.getElementById('detailModal').classList.add('active');
                    } else {
                        showToast('Client non trouvé', 'error');
                    }
                } else {
                    showToast('Erreur lors du chargement des détails', 'error');
                }
            } catch (error) {
                console.error(error);
                showToast('Erreur de connexion', 'error');
            } finally {
                hideOverlay();
            }
        }

        // ==================== COMMANDE ====================
        function prepareCommandePourClient(clientId) {
            STATE.selected.clear();
            STATE.selected.add(clientId);
            document.querySelectorAll('.client-checkbox').forEach(cb => {
                cb.checked = cb.dataset.clientId === clientId;
            });
            updateSelectAllCheckbox();
            updateBulkActions();
            prepareCommande();
        }

        async function prepareCommande() {
            if (!STATE.selected.size) { showToast("Aucun client sélectionné", "error"); return; }
            try {
                showToast("Préparation en cours...", "info");
                const selectedData = STATE.clients.filter(c => STATE.selected.has(c.id));
                await loadFournisseurs();
                STATE.commandes = await prepareCommandesData(selectedData);
                showPreparationModal();
            } catch (err) { showToast("Erreur lors du chargement", "error"); }
        }

        async function prepareCommandesData(data) {
            showOverlay();
            const commandes = [];
            try {
                for (const client of data) {
                    try {
                        const details = await fetchClientDetails(client.id);
                        commandes.push({
                            clientId: client.id,
                            clientName: client.fullName,
                            clientPhone: client.phone,
                            clientAgency: client.agency,
                            salesperson: client.salesperson,
                            ...details,
                            netAmount: client.netAmount || 0
                        });
                    } catch {
                        commandes.push({
                            clientId: client.id,
                            clientName: client.fullName,
                            clientPhone: client.phone,
                            clientAgency: client.agency,
                            salesperson: client.salesperson,
                            typeVerre: "Non spécifié",
                            gammeVerres: "Standard",
                            monture: "Non spécifiée",
                            odSphere: "0.00",
                            odCylindre: "0.00",
                            odAxe: "0°",
                            odADD: "0.00",
                            odDP: "0",
                            odHauteur: "0",
                            ogSphere: "0.00",
                            ogCylindre: "0.00",
                            ogAxe: "0°",
                            ogADD: "0.00",
                            ogDP: "0",
                            ogHauteur: "0",
                            netAmount: client.netAmount || 0
                        });
                    }
                }
            } finally { hideOverlay(); }
            return commandes;
        }

        async function fetchClientDetails(clientId) {
            const result = await API.fetchData('dataclient');
            if (!result.success) throw new Error();
            const hm = {};
            result.data.headers.forEach((h, i) => { hm[h] = i; });
            const row = result.data.rows.find(r => r[0] === clientId);
            if (!row) throw new Error("Non trouvé");
            return {
                typeVerre: row[hm["Type de Verre"]] || "",
                gammeVerres: row[hm["Gamme des Verres"]] || "",
                monture: row[hm["Choix de Monture"]] || "",
                odSphere: row[hm["OD Sphere"]] || "0.00",
                odCylindre: row[hm["OD Cylindre"]] || "0.00",
                odAxe: row[hm["OD Axe"]] || "0°",
                odADD: row[hm["OD ADD"]] || "0.00",
                odDP: row[hm["OD DP"]] || "0",
                odHauteur: row[hm["OD Hauteur"]] || "0",
                ogSphere: row[hm["OG Sphere"]] || "0.00",
                ogCylindre: row[hm["OG Cylindre"]] || "0.00",
                ogAxe: row[hm["OG Axe"]] || "0°",
                ogADD: row[hm["OG ADD"]] || "0.00",
                ogDP: row[hm["OG DP"]] || "0",
                ogHauteur: row[hm["OG Hauteur"]] || "0"
            };
        }

            const body = document.getElementById(`client-body-${idx}`);

        function genererOptionsTypesCommandes(currentValue) {
            if (!STATE.fournisseurSelectionne || !STATE.typesCommande[STATE.fournisseurSelectionne]?.length) {
                return '<option value="">-- Choisir un fournisseur d\'abord --</option>';
            }
            let options = '<option value="">-- Choisir un type --</option>';
            STATE.typesCommande[STATE.fournisseurSelectionne].forEach(type => {
                const selected = (currentValue === type) ? 'selected' : '';
                options += `<option value="${Utils.escapeHtml(type)}" ${selected}>${Utils.escapeHtml(type)}</option>`;
            });
            return options;
        }

        function mettreAJourOptionsTypesClients() {
            const selects = document.querySelectorAll('.client-type-select');
            if (!STATE.fournisseurSelectionne || !STATE.typesCommande[STATE.fournisseurSelectionne]?.length) {
                selects.forEach(select => {
                    select.innerHTML = '<option value="">-- Choisir un fournisseur d\'abord --</option>';
                });
                return;
            }
            const types = STATE.typesCommande[STATE.fournisseurSelectionne];
            selects.forEach(select => {
                const currentValue = select.getAttribute('data-current-value') || '';
                let options = '<option value="">-- Choisir un type --</option>';
                types.forEach(type => {
                    const selected = (currentValue === type) ? 'selected' : '';
                    options += `<option value="${Utils.escapeHtml(type)}" ${selected}>${Utils.escapeHtml(type)}</option>`;
                });
                select.innerHTML = options;
            });
        }

        function updateClientTypeCommande(clientId, value) {
            if (value && value !== '') {
                STATE.typesCommandeParClient.set(clientId, value);
                const select = document.querySelector(`.client-type-select[data-client-id="${clientId}"]`);
                if (select) select.setAttribute('data-current-value', value);
                showToast(`Type de commande mis à jour`, 'success');
            } else {
                STATE.typesCommandeParClient.delete(clientId);
                const select = document.querySelector(`.client-type-select[data-client-id="${clientId}"]`);
                if (select) select.removeAttribute('data-current-value');
            }
        }

        function onFournisseurChange(fournisseur) {
            const nfc = document.getElementById('nouveauFournisseurContainer');

            if (fournisseur === 'autre') {
                nfc.style.display = 'block';
                STATE.fournisseurSelectionne = null;
                document.querySelectorAll('.client-type-select').forEach(select => {
                    select.innerHTML = '<option value="">-- Choisir un fournisseur d\'abord --</option>';
                    select.disabled = true;
                });
                document.querySelectorAll('.btn-add-type').forEach(btn => {
                    btn.disabled = true;
                    btn.style.opacity = '0.5';
                    btn.style.cursor = 'not-allowed';
                });
            } else if (fournisseur) {
                nfc.style.display = 'none';
                STATE.fournisseurSelectionne = fournisseur;
                const types = STATE.typesCommande[STATE.fournisseurSelectionne] || [];
                document.querySelectorAll('.client-type-select').forEach(select => {
                    const clientId = select.getAttribute('data-client-id');
                    const currentType = STATE.typesCommandeParClient.get(clientId) || '';
                    let options = '<option value="">-- Choisir un type --</option>';
                    types.forEach(type => {
                        const selected = (currentType === type) ? 'selected' : '';
                        options += `<option value="${Utils.escapeHtml(type)}" ${selected}>${Utils.escapeHtml(type)}</option>`;
                    });
                    select.innerHTML = options;
                    select.disabled = false;
                    if (currentType && types.includes(currentType)) {
                        select.value = currentType;
                        select.setAttribute('data-current-value', currentType);
                    }
                });
                document.querySelectorAll('.btn-add-type').forEach(btn => {
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    btn.style.cursor = 'pointer';
                });
            } else {
                nfc.style.display = 'none';
                STATE.fournisseurSelectionne = null;
                document.querySelectorAll('.client-type-select').forEach(select => {
                    select.innerHTML = '<option value="">-- Choisir un fournisseur d\'abord --</option>';
                    select.disabled = true;
                });
                document.querySelectorAll('.btn-add-type').forEach(btn => {
                    btn.disabled = true;
                    btn.style.opacity = '0.5';
                    btn.style.cursor = 'not-allowed';
                });
                STATE.typesCommandeParClient.clear();
            }
        }

        function ajouterNouveauFournisseur() {
            const inp = document.getElementById('nouveauFournisseurInput');
            const val = inp.value.trim();
            if (!val) return;

            if (!STATE.fournisseurs.includes(val)) {
                STATE.fournisseurs.push(val);
                STATE.fournisseurs.sort();
            }

            const sel = document.getElementById('fournisseurSelect');
            let optionExists = false;
            for (let i = 0; i < sel.options.length; i++) {
                if (sel.options[i].value === val) { optionExists = true;
                    sel.options[i].selected = true; break; }
            }
            if (!optionExists) {
                const autreOption = sel.querySelector('option[value="autre"]');
                const opt = document.createElement('option');
                opt.value = val;
                opt.textContent = val;
                opt.selected = true;
                if (autreOption) sel.insertBefore(opt, autreOption);
                else sel.appendChild(opt);
            }

            STATE.fournisseurSelectionne = val;
            if (!STATE.typesCommande[val]) STATE.typesCommande[val] = [];

            document.querySelectorAll('.client-type-select').forEach(select => select.disabled = false);
            document.querySelectorAll('.btn-add-type').forEach(btn => {
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
            });

            mettreAJourOptionsTypesClients();
            document.getElementById('nouveauFournisseurContainer').style.display = 'none';
            inp.value = '';
            showToast(`Fournisseur "${val}" ajouté`, 'success');

            const modal = document.getElementById('modal-nouveau-type');

        function validerNouveauType(clientId) {
            const input = document.getElementById('nouveauTypeInput');
            if (!input) return;
            const nouveauType = input.value.trim();
            if (!nouveauType) { showToast("Veuillez entrer un nom de type", "warning");
                input.focus(); return; }

            if (!STATE.typesCommande[STATE.fournisseurSelectionne]) {
                STATE.typesCommande[STATE.fournisseurSelectionne] = [];
            }

            if (!STATE.typesCommande[STATE.fournisseurSelectionne].includes(nouveauType)) {
                STATE.typesCommande[STATE.fournisseurSelectionne].push(nouveauType);
                STATE.typesCommande[STATE.fournisseurSelectionne].sort();
                showToast(`Type "${nouveauType}" ajouté avec succès`, 'success');
            } else {
                showToast(`Le type "${nouveauType}" existe déjà`, 'info');
                fermerModalNouveauType();
                return;
            }

            mettreAJourOptionsTypesClients();

            const select = document.querySelector(`.client-type-select[data-client-id="${clientId}"]`);
            if (select) {
                select.value = nouveauType;
                select.setAttribute('data-current-value', nouveauType);
            }
            STATE.typesCommandeParClient.set(clientId, nouveauType);
            fermerModalNouveauType();
        }

        // ==================== VALIDATION COMMANDE ====================
        function verifierTypesClients() {
            const clientsSansType = [];
            for (const client of STATE.commandes) {
                if (!STATE.typesCommandeParClient.has(client.clientId)) {
                    clientsSansType.push(client.clientName);
                }
            }
            return clientsSansType;
        }

        async function validerCommande() {
            if (!STATE.fournisseurSelectionne) {
                showToast("Veuillez sélectionner un fournisseur", "error");
                return;
            }

            const clientsSansType = verifierTypesClients();
            if (clientsSansType.length > 0) {
                const message = `Les clients suivants n'ont pas de type de commande sélectionné :\n\n${clientsSansType.join('\n')}\n\nVeuillez sélectionner un type pour chaque client.`;
                showToast(`Type manquant pour ${clientsSansType.length} client(s)`, "error");
                await customConfirm({
                    title: "⚠️ Types de commande manquants",
                    message: message,
                    type: "warning",
                    confirmText: "OK",
                    cancelText: ""
                });
                return;
            }

            const allDates = STATE.commandes.every(c => STATE.datesLivraison.get(c.clientId));
            if (!allDates) {
                const ok = await confirmAction("Certaines dates de livraison ne sont pas renseignées. Continuer ?", 'warning');
                if (!ok) return;
            }

            try {
                await loadCompanyInfo();
                showOverlay();
                const username = TokenManager.getUser();
                const today = new Date().toISOString().split('T')[0];
                const updates = STATE.commandes.map(c => ({
                    id: c.clientId,
                    ancienStatut: STATE.clients.find(cl => cl.id === c.clientId)?.status || '',
                    nouveauStatut: "Commande passée",
                    dateMiseAJour: today,
                    utilisateur: username,
                    fournisseur: STATE.fournisseurSelectionne,
                    typeCommande: STATE.typesCommandeParClient.get(c.clientId) || '',
                    dateLivraisonPrevue: STATE.datesLivraison.get(c.clientId) || ''
                }));

                await API.postData('addpo', { updates });

                [STATE.clients, STATE.filtered].forEach(arr => arr.forEach(c => {
                    if (STATE.selected.has(c.id)) c.status = "Commande passée";
                }));

                buildStatusCards();
                displayClients();
                updateStatusFilter();
                clearSelection();
                generateBonDeCommande();
                closeModal();
                showToast("Commande validée avec succès", 'success');
            } catch (error) {
                console.error(error);
                showToast("Erreur lors de la validation", "error");
            } finally {
                hideOverlay();
            }
        }

        async function loadCatalogueDataVente() {
            try {
                const data = await API.fetchData('catalogue');
                if (!data.success) return null;

                const fields = {
                    entreprise: data.data.entreprises,
                    agence: data.data.agences,
                    commercial: data.data.commerciaux,
                    type_verre: data.data.typesVerre,
                    gamme_verre: data.data.gammesVerre,
                    vente_assurance: data.data.assurances,
                    vente_compagnie: data.data.compagnies,
                    clinique: data.data.cliniques,
                    ophtalmo: data.data.ophtalmos
                };

                Object.entries(fields).forEach(([id, values]) => {
                    const select = vEl(id);
                    if (select && select.tagName === 'SELECT' && Array.isArray(values)) {
                        select.innerHTML = '<option value="">-- Choisir --</option>';
                        values.forEach(v => {
                            if (v && typeof v === 'string') {
                                const opt = document.createElement('option');
                                opt.value = v;
                                opt.textContent = v;
                                select.appendChild(opt);
                            }
                        });
                    }
                });

                const sphereValues = data.data.sphere || ['0.00'];
                const axeValues = data.data.axe || ['0°'];
                const addValues = data.data.add || data.data.ajouter || ['0.00'];

                const populatePresc = (id, values) => {
                    const select = vEl(id);
                    if (select && select.tagName === 'SELECT') {
                        select.innerHTML = '<option value="">--</option>';
                        values.forEach(v => {
                            if (v && typeof v === 'string') {
                                const opt = document.createElement('option');
                                opt.value = v;
                                opt.textContent = v;
                                select.appendChild(opt);
                            }
                        });
                    }
                };

                ['od_sphere', 'od_cylindre', 'og_sphere', 'og_cylindre'].forEach(n => populatePresc(n, sphereValues));
                ['od_axe', 'og_axe'].forEach(n => populatePresc(n, axeValues));
                ['od_add', 'og_add'].forEach(n => populatePresc(n, addValues));

                return data;
            } catch (error) {
                console.error('Erreur chargement catalogue:', error);
                return null;
            }
        }

        async function loadMonturesForAgenceVente(agenceValue = null) {
            const agence = agenceValue || vEl('agence')?.value;
            const select = vEl('choix_monture');
            if (!agence || !select) return null;

            select.disabled = true;
            select.innerHTML = '<option value="">-- Chargement --</option>';

            try {
                const data = await API.fetchData('stockmonture');
                if (data.success && data.data.rows) {
                    select.innerHTML = '<option value="">-- Sélectionner --</option>';
                    data.data.rows
                        .filter(row => row[1]?.toLowerCase() === agence.toLowerCase())
                        .forEach(row => {
                            const opt = document.createElement('option');
                            opt.value = row[0] || '';
                            opt.textContent = row[0] || '';
                            select.appendChild(opt);
                        });
                } else {
                    select.innerHTML = '<option value="">-- Aucune monture --</option>';
                }
            } catch (error) {
                console.error('Erreur chargement montures:', error);
                select.innerHTML = '<option value="">-- Erreur --</option>';
            } finally {
                select.disabled = false;
            }
            return select;
        }

        function vSetSelect(id, value) {
            const el = vEl(id);
            if (!el || !value) return;
            const norm = String(value).toLowerCase().trim();
            for (let i = 0; i < el.options.length; i++) {
                if (el.options[i].value.toLowerCase().trim() === norm ||
                    el.options[i].text.toLowerCase().trim() === norm) {
                    el.value = el.options[i].value;
                    return;
                }
            }
            const opt = new Option(value, value);
            el.add(opt);
            el.value = value;
        }

        function vSetValue(id, value) {
            const el = vEl(id);
            if (!el || value === undefined || value === null || value === '') return;
            el.value = value;
            if (el.tagName === 'SELECT') el.dispatchEvent(new Event('change', { bubbles: true }));
        }

            vSetValue('od_hauteur', clientData.od_hauteur);
            vSetSelect('og_sphere', clientData.og_sphere);
            vSetSelect('og_cylindre', clientData.og_cylindre);
            vSetSelect('og_axe', clientData.og_axe);
            vSetSelect('og_add', clientData.og_add);
            vSetValue('og_dp', clientData.og_dp);
            vSetValue('og_hauteur', clientData.og_hauteur);
            vSetValue('date_soin', Utils.formatDateForInput(clientData.date_soin));

            vSetValue('montant_monture', clientData.montant_monture);
            vSetValue('montant_verres', clientData.montant_verres);
            vSetValue('frais_livraison', clientData.frais_livraison);

            if (remiseTypeEl && clientData.type_remise) remiseTypeEl.value = clientData.type_remise;

            vSetValue('numero_police', clientData.numero_police);
            vSetValue('assure_principal_nom', clientData.nom_assure);
            vSetValue('date_livraison', Utils.formatDateForInput(clientData.date_livraison_prevue));
            vSetValue('telephone_contact', clientData.telephone_contact);
            vSetValue('adresse_livraison', clientData.adresse_livraison);

            const apEl = vEl('assure_principal');
            if (apEl && clientData.assure_principal) {
                apEl.value = clientData.assure_principal;
                const container = vEl('assure_principal_nom_container');
                if (container) container.style.display = 'block';
                if (clientData.assure_principal === 'oui') {
                    const inp = vEl('assure_principal_nom');
                    if (inp) inp.readOnly = true;
                }
            }

            const ctEl = vEl('contact_livraison_type');
            if (ctEl && clientData.contact_livraison_type) {
                ctEl.value = clientData.contact_livraison_type;
                if (clientData.contact_livraison_type === 'client') {
                    const tel = vEl('telephone_contact');
                    const addr = vEl('adresse_livraison');
                    if (tel) tel.readOnly = true;
                    if (addr) addr.readOnly = true;
                }
            }

            setTimeout(() => calculerTotalVente(), 100);

            const prevBtn = vEl('prevStepBtn');
            const nextBtn = vEl('nextStepBtn');
            const submitBtn = vEl('submitBtn');

            if (prevBtn) prevBtn.onclick = () => { if (AppState.currentStep > 1) { AppState.currentStep--;
                    updateStepDisplay(); } };
            if (nextBtn) nextBtn.onclick = () => { if (validateStep(AppState.currentStep) && AppState.currentStep < 4) { AppState.currentStep++;
                    updateStepDisplay(); } };
            if (submitBtn) submitBtn.onclick = () => submitSaleForm(clientData.id_client);

            ['montant_monture', 'montant_verres', 'frais_livraison', 'remise', 'part_assurance', 'acompte'].forEach(id => {
                vEl(id)?.addEventListener('input', calculerTotalVente);

            vEl('remise_type')?.addEventListener('change', calculerTotalVente);
            vEl('assure_principal')?.addEventListener('change', toggleAssurePrincipalVente);

            vEl('agence')?.addEventListener('change', () => loadMonturesForAgenceVente());
        }

        function updateStepDisplay() {
            for (let i = 1; i <= 4; i++) {
                vEl(`step-${i}`)?.classList.toggle('active', i === AppState.currentStep);
            }
            const prevBtn = vEl('prevStepBtn');
            const nextBtn = vEl('nextStepBtn');
            const submitBtn = vEl('submitBtn');
            if (prevBtn) prevBtn.style.display = AppState.currentStep > 1 ? 'block' : 'none';
            if (nextBtn) nextBtn.style.display = AppState.currentStep < 4 ? 'block' : 'none';
            if (submitBtn) submitBtn.style.display = AppState.currentStep === 4 ? 'block' : 'none';
        }

        function validateStep(step) {
            if (step === 1) {
                for (const id of ['nom_complet', 'numero', 'agence', 'commercial']) {
                    if (!vEl(id)?.value) { showToast(`Champ obligatoire : ${id.replace(/_/g, ' ')}`, 'error'); return false; }
                }
            }
            if (step === 2) {
                for (const id of ['type_verre', 'choix_monture']) {
                    if (!vEl(id)?.value) { showToast(`Veuillez sélectionner ${id === 'type_verre' ? 'un type de verre' : 'une monture'}`, 'error'); return false; }
                }
            }
            if (step === 4) {
                for (const id of ['date_livraison', 'contact_livraison_type', 'telephone_contact', 'adresse_livraison']) {
                    if (!vEl(id)?.value) { showToast(`Champ obligatoire : ${id.replace(/_/g, ' ')}`, 'error'); return false; }
                }
            }
            return true;
        }

        function calculerTotalVente() {
            const getVal = (id) => parseFloat(vEl(id)?.value || '0') || 0;

            const totalBrutEl = vEl('total_brut_display');
            const netAPayerEl = vEl('net_a_payer_display');
            const resteAPayerEl = vEl('reste_a_payer_display');
            if (!totalBrutEl || !netAPayerEl || !resteAPayerEl) return;

            const brut = getVal('montant_monture') + getVal('montant_verres') + getVal('frais_livraison');
            const remise = getVal('remise');
            const remiseType = vEl('remise_type')?.value || 'FCFA';
            const remiseVal = remiseType === '%' ? brut * remise / 100 : remise;
            const partAssur = getVal('part_assurance');
            const net = Math.max(0, brut - remiseVal - partAssur);
            const reste = Math.max(0, net - getVal('acompte'));

            totalBrutEl.textContent = brut.toLocaleString();
            netAPayerEl.textContent = net.toLocaleString();
            resteAPayerEl.textContent = reste.toLocaleString();
        }

        function toggleAssurePrincipalVente() {
            const val = vEl('assure_principal')?.value;
            const container = vEl('assure_principal_nom_container');
            const input = vEl('assure_principal_nom');
            if (val === 'oui' || val === 'non') {
                if (container) container.style.display = 'block';
                if (val === 'oui' && input) { input.value = vEl('nom_complet')?.value || '';
                    input.readOnly = true; } else if (input) { input.value = '';
                    input.readOnly = false; }
            } else if (container) {
                container.style.display = 'none';
            }
        }

        function updateContactFieldsVente() {
            const type = vEl('contact_livraison_type')?.value;
            const tel = vEl('telephone_contact');
            const addr = vEl('adresse_livraison');
            if (type === 'client') {
                const indicatif = vEl('indicatif')?.value || '';
                const numero = vEl('numero')?.value || '';
                if (tel) { tel.value = indicatif + ' ' + numero;
                    tel.readOnly = true; }
                const agenceText = vEl('agence')?.selectedOptions?.[0]?.text || '';
                if (addr) { addr.value = agenceText;
                    addr.readOnly = true; }
            } else {
                if (tel) { tel.readOnly = false;
                    tel.value = ''; }
                if (addr) { addr.readOnly = false;
                    addr.value = ''; }
            }
        }

        function resetSaleForm() {
            if (confirm('Réinitialiser le formulaire ?')) {
                vEl('vente-form')?.reset();
                const delivery = new Date();
                delivery.setDate(delivery.getDate() + 15);
                const dl = vEl('date_livraison');
                if (dl) dl.value = delivery.toISOString().split('T')[0];
                const cu = vEl('current_user');
                if (cu) cu.value = AppState.user.nom;
                calculerTotalVente();
                AppState.currentStep = 1;
                updateStepDisplay();
            }
        }

        function toggleCustomInputVente(fieldName) {
            const select = vEl(fieldName);
            const input = vEl(fieldName + '_input');
            const button = event.currentTarget;
            if (!select || !input || !button) return;

            if (input.style.display === 'none' || input.style.display === '') {
                select.style.display = 'none';
                input.style.display = 'block';
                input.value = '';
                button.innerHTML = '<i class="fas fa-list"></i> Choisir existant';
            } else {
                select.style.display = 'block';
                input.style.display = 'none';
                button.innerHTML = '<i class="fas fa-plus"></i> Ajouter nouveau';
                if (input.value?.trim() && select.tagName === 'SELECT') {
                    let exists = false;
                    for (let i = 0; i < select.options.length; i++) {
                        if (select.options[i].text === input.value.trim()) { exists = true; break; }
                    }
                    if (!exists) select.appendChild(new Option(input.value.trim(), input.value.trim()));
                    select.value = input.value.trim();
                }
            }
        }

        async function submitSaleForm(clientId) {
            for (let step = 1; step <= 4; step++) {
                if (!validateStep(step)) return;
            }

            const submitBtn = vEl('submitBtn');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi...';
            }

            const data = {};
            venteModal.querySelectorAll('#vente-form input, #vente-form select, #vente-form textarea').forEach(el => {
                if (el.name && !el.disabled && el.id !== 'indicatif') {
                    data[el.name] = el.value;
                }
            });

            data.assurance = vEl('vente_assurance_input')?.style.display === 'block' ?
                vEl('vente_assurance_input')?.value || vEl('vente_assurance')?.value :
                vEl('vente_assurance')?.value || '';
            data.compagnie = vEl('vente_compagnie_input')?.style.display === 'block' ?
                vEl('vente_compagnie_input')?.value || vEl('vente_compagnie')?.value :
                vEl('vente_compagnie')?.value || '';

            ['entreprise', 'commercial', 'clinique', 'ophtalmo'].forEach(field => {
                const inp = vEl(field + '_input');
                if (inp?.style.display === 'block' && inp.value) data[field] = inp.value;
            });

            const indicatif = vEl('indicatif')?.value || '+229';
            const numero = vEl('numero')?.value || '';
            data.numero = indicatif + ' ' + numero;

            data.total_brut = parseFloat(vEl('total_brut_display')?.textContent?.replace(/[^0-9.-]/g, '') || '0') || 0;
            data.net_a_payer = parseFloat(vEl('net_a_payer_display')?.textContent?.replace(/[^0-9.-]/g, '') || '0') || 0;
            data.reste_a_payer = parseFloat(vEl('reste_a_payer_display')?.textContent?.replace(/[^0-9.-]/g, '') || '0') || 0;
            data.utilisateur = AppState.user.nom;
            data.id_client = clientId;

            try {
                await API.postData('updateCommandeClient', data);
                showToast('Vente modifiée avec succès !', 'success');
                setTimeout(() => fermerModalVente(), 1500);
            } catch (error) {
                console.error('Erreur soumission:', error);
                showToast("Erreur de connexion", 'error');
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '✓ Enregistrer';
                }
            }
        }

        function fermerModalVente() {
            window.location.href = 'Data.html';
        }

        // ==================== APPEL TÉLÉPHONIQUE ====================
        function callClient(phone) {
            const clean = Utils.cleanPhone(phone);
            if (!clean) { showToast("Numéro invalide", "error"); return; }
            customConfirm({ title: "Appel", message: `Appeler le ${Utils.formatPhone(clean)} ?`, type: "info", confirmText: "Appeler", cancelText: "Annuler" })
                .then(ok => { if (ok) window.location.href = `tel:${clean}`; });
        }

        function refreshClients() { loadClientsData(); }

        function showLoadingState() {
            document.getElementById('clientsTableBody').innerHTML = `<tr><td colspan="8"><div class="loading-indicator"><div class="spinner-border"></div><div>Chargement des clients...</div></div></td></tr>`;
        }

        function showErrorState() {
            document.getElementById('clientsTableBody').innerHTML = `<tr><td colspan="8"><div style="text-align:center;padding:2rem;"><i class="fas fa-exclamation-triangle" style="font-size:2rem;color:var(--c-red);display:block;margin-bottom:.5rem;"></i><div style="color:var(--c-red);font-weight:600;margin-bottom:.5rem;">Erreur de chargement</div><button class="btn btn-primary" onclick="loadClientsData()"><i class="fas fa-redo"></i> Réessayer</button></div></td></tr>`;
        }

        // ==================== INACTIVITÉ ====================
        function startInactivityTimer() {
            const LIMIT = 30 * 60 * 1000;
            let inactivityTimer;

            function reset() {
                clearTimeout(inactivityTimer);
                inactivityTimer = setTimeout(() => {
                    TokenManager.redirectToLogin();
                }, LIMIT);
            }
            ["load", "mousemove", "keydown", "click", "scroll"].forEach(e => window.addEventListener(e, reset, true));
            reset();
        }

        // ==================== THEME / SCROLL ====================
        function initTheme() {
            const btn = document.getElementById('themeToggle');
            if (!btn) return;
            btn.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const dark = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme', dark ? 'dark' : 'light');
                btn.innerHTML = `<i class="fas fa-${dark ? 'sun' : 'moon'}"></i>`;
            });
        }

        function handleScroll() {
            const fab = document.getElementById('fab');
            if (fab) {
                fab.classList.toggle('visible', window.scrollY > 300);
            }
        }

        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        // ==================== INITIALISATION ====================
        document.addEventListener('DOMContentLoaded', () => {
            if (!TokenManager.check()) return;

            const username = TokenManager.getUser();
            document.getElementById("topbar-username").textContent = username;
document.getElementById("user-avatar").src = `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=3D4FE0&color=fff&size=64`;

            updateCurrentDate();
            initTheme();
            window.addEventListener('scroll', handleScroll);
            startInactivityTimer();

            loadClientsData();
            chargerTypesCommande();
            loadFournisseurs();
            loadCompanyInfo();
        });

        // ==================== EXPORTS GLOBAUX ====================
        window.ouvrirDetailClient = ouvrirDetailClient;
        window.fermerDetailModal = fermerDetailModal;
        window.switchTab = switchTab;
        window.callClient = callClient;
        window.refreshClients = refreshClients;
        window.scrollToTop = scrollToTop;
        window.openVueGlobale = openVueGlobale;
        window.closeModal = closeModal;
        window.selectCommandeClient = selectCommandeClient;
        window.editCommande = editCommande;
        window.editField = editField;
        window.saveFieldEdit = saveFieldEdit;
        window.saveCommandeEdit = saveCommandeEdit;
        window.showFournisseurModal = showFournisseurModal;
        window.onFournisseurChange = onFournisseurChange;
        window.ajouterNouveauFournisseur = ajouterNouveauFournisseur;
        window.updateClientTypeCommande = updateClientTypeCommande;
        window.ajouterNouveauTypeCommandeClient = ajouterNouveauTypeCommandeClient;
        window.fermerModalNouveauType = fermerModalNouveauType;
        window.validerNouveauType = validerNouveauType;
        window.toggleClientCard = toggleClientCard;
        window.validerCommande = validerCommande;
        window.prepareCommande = prepareCommande;
        window.prepareCommandePourClient = prepareCommandePourClient;
        window.toggleSelectAll = toggleSelectAll;
        window.toggleClientSelection = toggleClientSelection;
        window.clearSelection = clearSelection;
        window.deleteClient = deleteClient;
        window.markAsReceived = markAsReceived;
        window.debounceSearch = debounceSearch;
        window.applyFilters = applyFilters;
        window.filterByStatus = filterByStatus;
        window.resetStatusFilter = resetStatusFilter;
        window.closeToast = closeToast;
        window.showToast = showToast;
        window.confirmAction = confirmAction;
        window.customConfirm = customConfirm;
        window.ouvrirModalVenteClient = ouvrirModalVenteClient;
        window.fermerModalVente = fermerModalVente;
        window.calculerTotalVente = calculerTotalVente;
        window.toggleCustomInputVente = toggleCustomInputVente;
        window.resetSaleForm = resetSaleForm;
        window.toggleAssurePrincipalVente = toggleAssurePrincipalVente;
        window.updateContactFieldsVente = updateContactFieldsVente;
        window.TokenManager = TokenManager;
    </script>

</body>
</html>
