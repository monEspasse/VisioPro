<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>VisioPro - Base Client</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
           RÉINITIALISATION & VARIABLES VISIOPRO
        ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --c-bg: #F7F6F3;
            --c-surface: #FFFFFF;
            --c-surface2: #F0EEE9;
            --c-ink: #1A1916;
            --c-ink2: #6B6860;
            --c-ink3: #A8A69F;
            --c-border: #E3E1DB;
            --c-border2: #C8C5BC;
            --c-accent: #3D4FE0;
            --c-accent-lt: #EEF0FD;
            --c-accent-dk: #2534B8;
            --c-green: #1A8A5A;
            --c-green-lt: #E6F5EE;
            --c-red: #C43B3B;
            --c-red-lt: #FCEAEA;
            --c-amber: #B07020;
            --c-amber-lt: #FDF3E3;
            --shadow-sm: 0 1px 3px rgba(26,25,22,.06), 0 1px 2px rgba(26,25,22,.04);
            --shadow-md: 0 4px 12px rgba(26,25,22,.08), 0 2px 4px rgba(26,25,22,.04);
            --shadow-lg: 0 12px 32px rgba(26,25,22,.10), 0 4px 8px rgba(26,25,22,.06);
            --r-sm: 6px;
            --r-md: 10px;
            --r-lg: 14px;
            --r-xl: 20px;
            --ease: cubic-bezier(.4,0,.2,1);
            --font: 'DM Sans', system-ui, sans-serif;
            --font-mono: 'DM Mono', monospace;
        }

        body {
            background: var(--c-bg);
            font-family: var(--font);
            color: var(--c-ink);
            min-height: 100vh;
            padding-bottom: 80px;
            -webkit-font-smoothing: antialiased;
        }

        /* ================================================================
           ANIMATIONS
        ================================================================ */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(16px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        @keyframes modalSlideIn {
            from { opacity: 0; transform: scale(0.92) translateY(-20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }

        /* ================================================================
           SKELETON
        ================================================================ */
        .skeleton {
            background: linear-gradient(90deg, var(--c-surface2) 25%, var(--c-surface) 50%, var(--c-surface2) 75%);
            background-size: 1000px 100%;
            animation: shimmer 1.5s infinite linear;
            border-radius: var(--r-sm);
            min-height: 1em;
        }

        /* ================================================================
           SHELL
        ================================================================ */
        .shell {
            max-width: 1600px;
            margin: 0 auto;
            padding: 1.25rem 1.25rem 0;
            animation: fadeUp .4s var(--ease) both;
        }

        /* ================================================================
           TOPBAR
        ================================================================ */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--r-xl);
            padding: .75rem 1.25rem;
            margin-bottom: 1.25rem;
            box-shadow: var(--shadow-sm);
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: .75rem;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            background: var(--c-accent);
            border-radius: var(--r-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: .85rem;
            overflow: hidden;
            flex-shrink: 0;
        }
        .brand-mark img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

        .brand-mark i {
            font-size: 1rem;
        }

        .brand-name {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -.02em;
            color: var(--c-ink);
        }

        .brand-name span {
            color: var(--c-accent);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: .75rem;
        }

        .topbar-date {
            font-size: .8rem;
            color: var(--c-ink3);
            font-variant-numeric: tabular-nums;
        }

        .topbar-user {
            font-size: .85rem;
            font-weight: 500;
            color: var(--c-ink2);
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid var(--c-border);
            object-fit: cover;
        }

        /* ================================================================
           CONTROLS PANEL
        ================================================================ */
        .controls-panel {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--r-lg);
            padding: .75rem 1rem;
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: .75rem;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .search-box {
            flex: 1;
            min-width: 180px;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: .75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--c-ink3);
            font-size: .78rem;
            pointer-events: none;
        }

        .search-box input {
            width: 100%;
            padding: .5rem .8rem .5rem 2.1rem;
            background: var(--c-bg);
            border: 1px solid var(--c-border);
            border-radius: var(--r-md);
            font-family: inherit;
            font-size: .85rem;
            color: var(--c-ink);
            transition: all .15s;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--c-accent);
            box-shadow: 0 0 0 3px rgba(61,79,224,.1);
        }

        .search-box input::placeholder {
            color: var(--c-ink3);
        }

        .filters-group {
            display: flex;
            gap: .5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-select {
            padding: .5rem .8rem;
            background: var(--c-bg);
            border: 1px solid var(--c-border);
            border-radius: var(--r-md);
            font-family: inherit;
            font-size: .82rem;
            color: var(--c-ink2);
            cursor: pointer;
            transition: all .15s;
            outline: none;
            min-width: 130px;
        }

        .filter-select:focus {
            border-color: var(--c-accent);
            box-shadow: 0 0 0 3px rgba(61,79,224,.1);
        }

        /* ================================================================
           BOUTONS
        ================================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding: .5rem 1rem;
            border-radius: var(--r-md);
            font-family: inherit;
            font-size: .83rem;
            font-weight: 500;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all .15s var(--ease);
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--c-accent);
            color: #fff;
            border-color: var(--c-accent);
        }

        .btn-primary:hover {
            background: var(--c-accent-dk);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(61,79,224,.35);
        }

        .btn-primary:active {
            transform: scale(0.96);
        }

        .btn-secondary {
            background: var(--c-surface);
            color: var(--c-ink2);
            border-color: var(--c-border);
        }

        .btn-secondary:hover {
            background: var(--c-surface2);
            color: var(--c-ink);
            border-color: var(--c-border2);
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--c-green);
            color: #fff;
            border-color: var(--c-green);
        }

        .btn-success:hover {
            background: #14724a;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26,138,90,.35);
        }

        .btn-danger {
            background: var(--c-red);
            color: #fff;
            border-color: var(--c-red);
        }

        .btn-danger:hover {
            background: #a32e2e;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(196,59,59,.35);
        }

        .btn-outline {
            background: transparent;
            color: var(--c-ink2);
            border-color: var(--c-border);
        }

        .btn-outline:hover {
            background: var(--c-surface2);
            border-color: var(--c-border2);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-small {
            padding: .25rem .6rem;
            font-size: .7rem;
            border-radius: var(--r-sm);
        }

        /* ================================================================
           CARTES SYNTHÈSE
        ================================================================ */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: .75rem;
            margin-bottom: 1rem;
        }

        .summary-card {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--r-lg);
            padding: .85rem 1rem;
            box-shadow: var(--shadow-sm);
            transition: all .2s var(--ease);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .summary-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .summary-card.active-filter {
            border-color: var(--c-accent);
            box-shadow: 0 0 0 2px rgba(61,79,224,.2);
        }

        .summary-card .card-icon {
            width: 32px;
            height: 32px;
            border-radius: var(--r-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: .75rem;
            flex-shrink: 0;
            transition: transform .2s ease;
        }

        .summary-card:hover .card-icon {
            transform: scale(1.1) rotate(3deg);
        }

        .summary-card .card-label {
            font-size: .72rem;
            font-weight: 500;
            color: var(--c-ink3);
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .summary-card .card-value {
            font-family: var(--font-mono);
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--c-ink);
            line-height: 1.2;
        }

        .summary-card .card-inner {
            display: flex;
            align-items: center;
            gap: .75rem;
        }

        .summary-card .card-info {
            flex: 1;
            min-width: 0;
        }

        /* ================================================================
           BULK ACTIONS
        ================================================================ */
        .bulk-actions {
            background: var(--c-amber-lt);
            border: 1px solid rgba(176,112,32,.2);
            border-radius: var(--r-md);
            padding: .65rem 1rem;
            margin-bottom: .75rem;
            display: none;
            align-items: center;
            gap: .75rem;
            flex-wrap: wrap;
            animation: fadeUp .25s var(--ease);
        }

        .bulk-actions.show {
            display: flex;
        }

        .selected-count {
            font-weight: 700;
            color: var(--c-amber);
        }

        .bulk-action-btn {
            padding: .35rem .85rem;
            border-radius: var(--r-sm);
            border: 1px solid var(--c-border);
            background: var(--c-surface);
            color: var(--c-ink2);
            font-size: .78rem;
            font-weight: 500;
            cursor: pointer;
            transition: all .15s var(--ease);
            display: inline-flex;
            align-items: center;
            gap: .35rem;
        }

        .bulk-action-btn:hover {
            border-color: var(--c-accent);
            color: var(--c-accent);
        }

        .bulk-action-btn.delete:hover {
            border-color: var(--c-red);
            color: var(--c-red);
        }

        /* ================================================================
           TABLE
        ================================================================ */
        .table-container {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--r-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .table-wrapper {
            max-height: 550px;
            overflow-y: auto;
            overflow-x: auto;
        }

        .table-wrapper::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--c-border2);
            border-radius: 3px;
        }

        .clients-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
            font-size: .85rem;
        }

        .clients-table thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .clients-table th {
            background: var(--c-surface2);
            padding: .65rem .85rem;
            text-align: left;
            font-size: .72rem;
            font-weight: 600;
            color: var(--c-ink2);
            letter-spacing: .04em;
            text-transform: uppercase;
            border-bottom: 1px solid var(--c-border);
        }

        .clients-table tbody tr {
            border-bottom: 1px solid var(--c-border);
            transition: background .12s;
            animation: fadeUp .25s var(--ease) both;
            cursor: pointer;
        }

        .clients-table tbody tr:hover {
            background: var(--c-accent-lt);
        }

        .clients-table td {
            padding: .65rem .85rem;
            color: var(--c-ink);
            vertical-align: middle;
        }

        .checkbox-cell {
            width: 36px;
            text-align: center;
        }

        .client-checkbox,
        .select-all-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--c-accent);
        }

        .client-info-cell {
            display: flex;
            align-items: center;
            gap: .6rem;
        }

        .client-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--c-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: .7rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .client-name {
            font-weight: 600;
            color: var(--c-ink);
            font-size: .85rem;
        }

        .client-id {
            font-size: .7rem;
            color: var(--c-ink3);
            margin-top: 1px;
        }

        .status-badge {
            display: inline-block;
            padding: .2rem .6rem;
            border-radius: 999px;
            font-size: .7rem;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
        }

        .action-btns {
            display: flex;
            gap: .3rem;
        }

        .action-btn {
            width: 28px;
            height: 28px;
            border-radius: var(--r-sm);
            border: 1px solid var(--c-border);
            background: var(--c-surface);
            color: var(--c-ink3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .7rem;
            transition: all .15s var(--ease);
        }

        .action-btn:hover {
            transform: translateY(-1px);
            border-color: transparent;
        }

        .btn-view:hover {
            background: var(--c-accent);
            color: #fff;
        }

        .btn-call:hover {
            background: var(--c-green);
            color: #fff;
        }

        .btn-receive:hover {
            background: var(--c-amber);
            color: #fff;
        }

        .btn-delete:hover {
            background: var(--c-red);
            color: #fff;
        }

        /* ================================================================
           LOADING / NO DATA
        ================================================================ */
        .loading-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1rem;
            gap: .75rem;
            color: var(--c-ink3);
        }

        .spinner-border {
            width: 2rem;
            height: 2rem;
            border: 3px solid var(--c-border);
            border-top-color: var(--c-accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        .no-data {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--c-ink3);
        }

        .no-data i {
            font-size: 2rem;
            display: block;
            margin-bottom: .75rem;
            opacity: .4;
        }

        /* ================================================================
           ALERT MESSAGES
        ================================================================ */
        .alert-message {
            padding: .7rem 1rem;
            border-radius: var(--r-md);
            margin: .75rem 0;
            display: flex;
            align-items: center;
            gap: .5rem;
            animation: slideIn .3s var(--ease);
            font-size: .85rem;
        }

        .alert-success {
            background: var(--c-green-lt);
            color: var(--c-green);
            border-left: 3px solid var(--c-green);
        }

        .alert-error {
            background: var(--c-red-lt);
            color: var(--c-red);
            border-left: 3px solid var(--c-red);
        }

        .alert-warning {
            background: var(--c-amber-lt);
            color: var(--c-amber);
            border-left: 3px solid var(--c-amber);
        }

        .alert-info {
            background: var(--c-accent-lt);
            color: var(--c-accent);
            border-left: 3px solid var(--c-accent);
        }

        /* ================================================================
           TOAST
        ================================================================ */
        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            gap: .4rem;
            max-width: 340px;
        }

        .toast {
            display: flex;
            align-items: center;
            gap: .65rem;
            padding: .7rem 1rem;
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-md);
            font-size: .82rem;
            font-weight: 500;
            animation: slideIn .3s var(--ease) both;
        }

        .toast i {
            font-size: .9rem;
        }

        .toast.success { border-left: 3px solid var(--c-green); }
        .toast.success i { color: var(--c-green); }

        .toast.error { border-left: 3px solid var(--c-red); }
        .toast.error i { color: var(--c-red); }

        .toast.warning { border-left: 3px solid var(--c-amber); }
        .toast.warning i { color: var(--c-amber); }

        .toast.info { border-left: 3px solid var(--c-accent); }
        .toast.info i { color: var(--c-accent); }

        .toast-close {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--c-ink3);
            cursor: pointer;
            padding: .1rem .25rem;
            font-size: .9rem;
        }

        .toast-close:hover {
            color: var(--c-ink);
        }

        /* ================================================================
           MODAL GÉNÉRIQUE
        ================================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(26,25,22,.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 1rem;
            animation: fadeUp .25s var(--ease);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--c-surface);
            border-radius: var(--r-xl);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 600px;
            max-height: 92vh;
            overflow: hidden;
            animation: modalSlideIn .3s var(--ease);
        }

        .modal-content.xlarge-modal {
            max-width: 1400px;
            width: 98%;
        }

        .modal-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--c-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--c-accent);
            color: #fff;
            flex-shrink: 0;
        }

        .modal-title {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .modal-title i {
            color: rgba(255,255,255,.8);
        }

        .modal-close {
            width: 28px;
            height: 28px;
            border-radius: var(--r-sm);
            border: none;
            background: rgba(255,255,255,.15);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all .15s;
        }

        .modal-close:hover {
            background: rgba(255,255,255,.25);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 1.25rem 1.5rem;
            max-height: 65vh;
            overflow-y: auto;
        }

        .modal-footer {
            padding: .85rem 1.5rem;
            border-top: 1px solid var(--c-border);
            display: flex;
            justify-content: flex-end;
            gap: .5rem;
            flex-wrap: wrap;
            background: var(--c-bg);
            flex-shrink: 0;
        }

        /* ================================================================
           FORMULAIRES
        ================================================================ */
        .form-group {
            margin-bottom: .85rem;
        }

        .form-label {
            display: block;
            font-size: .8rem;
            font-weight: 500;
            color: var(--c-ink2);
            margin-bottom: .3rem;
        }

        .form-control {
            width: 100%;
            padding: .55rem .8rem;
            background: var(--c-bg);
            border: 1px solid var(--c-border);
            border-radius: var(--r-md);
            font-family: inherit;
            font-size: .85rem;
            color: var(--c-ink);
            outline: none;
            transition: all .15s;
        }

        .form-control:focus {
            border-color: var(--c-accent);
            box-shadow: 0 0 0 3px rgba(61,79,224,.1);
        }

        .form-control:disabled,
        .form-control[readonly] {
            background: var(--c-surface2);
            cursor: not-allowed;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: .75rem;
        }

        .form-step {
            display: none;
            animation: fadeUp .3s var(--ease);
        }

        .form-step.active {
            display: block;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--c-ink);
            margin: 1.25rem 0 .75rem 0;
            padding-bottom: .3rem;
            border-bottom: 2px solid var(--c-accent-lt);
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .section-title i {
            color: var(--c-accent);
        }

        .step-navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 1.25rem;
            padding-top: .75rem;
            border-top: 1px solid var(--c-border);
        }

        /* ================================================================
           MODALE DÉTAIL CLIENT (#detailModal)
        ================================================================ */
        #detailModal.modal-overlay {
            align-items: flex-start;
            justify-content: flex-end;
            background: rgba(0,0,0,.5);
            backdrop-filter: blur(2px) brightness(.9);
        }

        #detailModal .modal-content {
            max-width: 45%;
            width: 45%;
            max-height: 100vh;
            height: 100vh;
            border-radius: 0;
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            margin: 0;
            animation: slideIn .35s var(--ease);
        }

        #detailModal .modal-body {
            max-height: calc(100vh - 120px);
            height: calc(100vh - 120px);
            padding: 1.25rem;
            overflow-y: auto;
        }

        #detailModal .modal-header {
            border-radius: 0;
            flex-shrink: 0;
        }

        /* ================================================================
           FICHE CLIENT (contenu #detailModal)
        ================================================================ */
        .fc-hero {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--c-surface2);
            border-radius: var(--r-lg);
            margin-bottom: 1rem;
        }

        .fc-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--c-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .fc-hero-info {
            flex: 1;
        }

        .fc-hero-name {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .fc-hero-meta {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem 1rem;
            font-size: .8rem;
            color: var(--c-ink2);
        }

        .fc-hero-meta span {
            display: flex;
            align-items: center;
            gap: .3rem;
        }

        .fc-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--c-green);
            flex-shrink: 0;
        }

        .fc-actions {
            display: flex;
            flex-wrap: wrap;
            gap: .4rem;
            padding: .75rem 1rem;
            background: var(--c-surface2);
            border-radius: var(--r-lg);
            margin-bottom: 1rem;
        }

        .fc-actions button {
            font-size: .8rem;
            padding: .35rem .8rem;
            border-radius: var(--r-md);
            border: 1px solid var(--c-border);
            background: var(--c-surface);
            color: var(--c-ink2);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: .35rem;
            transition: all .15s;
            font-family: inherit;
        }

        .fc-actions button:hover {
            border-color: var(--c-accent);
            color: var(--c-accent);
            transform: translateY(-1px);
        }

        .fc-actions button.success:hover {
            border-color: var(--c-green);
            color: var(--c-green);
        }

        .tab-bar {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--c-border);
            margin-bottom: .75rem;
            overflow-x: auto;
        }

        .tab {
            padding: .5rem 1rem;
            font-size: .8rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--c-ink2);
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all .15s;
            white-space: nowrap;
        }

        .tab:hover {
            color: var(--c-ink);
        }

        .tab.active {
            color: var(--c-accent);
            border-bottom-color: var(--c-accent);
        }

        .tab-panel {
            display: none;
            animation: fadeUp .25s var(--ease);
        }

        .tab-panel.active {
            display: block;
        }

        .section-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: .75rem;
        }

        .card {
            background: var(--c-surface2);
            border-radius: var(--r-lg);
            padding: .85rem 1rem;
        }

        .card-title {
            font-size: .7rem;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--c-ink3);
            font-weight: 600;
            margin-bottom: .6rem;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: .25rem 0;
            border-bottom: 1px solid rgba(0,0,0,.04);
        }

        .row:last-child {
            border-bottom: none;
        }

        .row-label {
            font-size: .8rem;
            color: var(--c-ink2);
        }

        .row-value {
            font-size: .8rem;
            font-weight: 500;
            text-align: right;
        }

        .badge {
            display: inline-block;
            padding: .15rem .6rem;
            border-radius: 999px;
            font-size: .7rem;
            font-weight: 600;
        }

        .badge-info {
            background: var(--c-accent-lt);
            color: var(--c-accent);
        }

        .badge-success {
            background: var(--c-green-lt);
            color: var(--c-green);
        }

        .badge-danger {
            background: var(--c-red-lt);
            color: var(--c-red);
        }

        .badge-warning {
            background: var(--c-amber-lt);
            color: var(--c-amber);
        }

        .badge-purple {
            background: #EEEDFE;
            color: #3C3489;
        }

        .presc-header,
        .presc-row {
            display: grid;
            grid-template-columns: 1fr repeat(4, 1fr);
            gap: .5rem;
            font-size: .8rem;
            padding: .3rem .5rem;
        }

        .presc-header {
            font-size: .65rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--c-ink3);
            background: var(--c-surface);
            border-radius: var(--r-sm);
            margin-bottom: .2rem;
        }

        .presc-row {
            border-bottom: 1px solid rgba(0,0,0,.04);
        }

        .presc-row:last-child {
            border-bottom: none;
        }

        .presc-row-label {
            font-weight: 500;
            color: var(--c-ink2);
        }

        .presc-row-val {
            text-align: center;
        }

        .finance-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: .6rem;
            margin-bottom: .75rem;
        }

        .metric {
            background: var(--c-surface2);
            border-radius: var(--r-md);
            padding: .6rem .8rem;
            text-align: center;
        }

        .metric-label {
            font-size: .6rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--c-ink3);
        }

        .metric-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--c-ink);
        }

        .metric-value.green { color: var(--c-green); }
        .metric-value.red { color: var(--c-red); }

        .divider {
            height: 1px;
            background: var(--c-border);
            margin: .5rem 0;
        }

        /* ================================================================
           MODALE COMMANDE / FOURNISSEUR
        ================================================================ */
        .commande-visual-container,
        .validation-visual-container {
            display: flex;
            height: 55vh;
            gap: 1rem;
        }

        .commande-list-container,
        .validation-config-panel {
            flex: 0 0 300px;
            background: var(--c-surface2);
            border-radius: var(--r-lg);
            overflow-y: auto;
            border: 1px solid var(--c-border);
        }

        .commande-list-header,
        .validation-config-header {
            padding: .75rem 1rem;
            border-bottom: 1px solid var(--c-border);
            background: var(--c-surface);
            position: sticky;
            top: 0;
            z-index: 5;
            border-radius: var(--r-lg) var(--r-lg) 0 0;
        }

        .commande-list-title,
        .validation-config-title {
            font-size: .95rem;
            font-weight: 600;
        }

        .commande-list-subtitle,
        .validation-config-subtitle {
            font-size: .7rem;
            color: var(--c-ink3);
        }

        .commande-list {
            padding: .6rem;
        }

        .commande-client-item {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--r-md);
            padding: .6rem .8rem;
            margin-bottom: .4rem;
            cursor: pointer;
            transition: all .15s var(--ease);
        }

        .commande-client-item:hover {
            border-color: var(--c-accent);
            transform: translateX(3px);
        }

        .commande-client-item.selected {
            border-color: var(--c-accent);
            background: var(--c-accent-lt);
        }

        .commande-client-name {
            font-weight: 600;
            font-size: .85rem;
        }

        .commande-client-id {
            font-size: .65rem;
            color: var(--c-ink3);
        }

        .commande-client-details {
            display: flex;
            flex-wrap: wrap;
            gap: .2rem;
            margin-top: .2rem;
        }

        .commande-client-detail {
            background: var(--c-bg);
            padding: .1rem .4rem;
            border-radius: 3px;
            color: var(--c-ink2);
            font-size: .65rem;
        }

        .commande-details-container,
        .validation-clients-panel {
            flex: 1;
            background: var(--c-surface2);
            border-radius: var(--r-lg);
            overflow-y: auto;
            border: 1px solid var(--c-border);
            display: flex;
            flex-direction: column;
        }

        .commande-details-header,
        .validation-clients-header {
            padding: .75rem 1rem;
            border-bottom: 1px solid var(--c-border);
            background: var(--c-surface);
            border-radius: var(--r-lg) var(--r-lg) 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: .5rem;
            flex-shrink: 0;
        }

        .commande-details-title {
            font-weight: 600;
            font-size: .9rem;
        }

        .commande-details-badge {
            background: var(--c-accent);
            color: #fff;
            padding: .2rem .8rem;
            border-radius: 999px;
            font-size: .7rem;
            font-weight: 600;
        }

        .commande-details-content,
        .validation-clients-list {
            flex: 1;
            padding: .75rem 1rem;
            overflow-y: auto;
        }

        .commande-details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: .75rem;
        }

        .commande-details-section {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--r-md);
            padding: .75rem;
        }

        .commande-section-title {
            font-size: .75rem;
            font-weight: 600;
            color: var(--c-accent);
            margin-bottom: .5rem;
            padding-bottom: .3rem;
            border-bottom: 1px solid var(--c-border);
            display: flex;
            align-items: center;
            gap: .35rem;
        }

        .commande-details-row {
            display: flex;
            justify-content: space-between;
            padding: .2rem 0;
            border-bottom: 1px solid var(--c-border);
            font-size: .8rem;
        }

        .commande-details-row:last-child {
            border-bottom: none;
        }

        .commande-details-label {
            color: var(--c-ink2);
        }

        .commande-details-value {
            font-weight: 500;
        }

        .commande-details-value.highlight {
            color: var(--c-accent);
        }

        .commande-details-value.editable {
            cursor: pointer;
            padding: .1rem .4rem;
            border-radius: 4px;
            background: var(--c-bg);
            transition: background .15s;
        }

        .commande-details-value.editable:hover {
            background: var(--c-accent-lt);
        }

        .edit-form {
            background: var(--c-surface);
            border: 1px solid var(--c-accent);
            border-radius: var(--r-md);
            padding: .6rem;
            margin-top: .3rem;
            animation: fadeUp .2s var(--ease);
        }

        .edit-form-row {
            display: flex;
            flex-direction: column;
            gap: .2rem;
            margin-bottom: .4rem;
        }

        .edit-form-label {
            font-size: .65rem;
            font-weight: 600;
            color: var(--c-ink2);
        }

        .edit-form-input {
            padding: .3rem .5rem;
            border: 1px solid var(--c-border);
            border-radius: var(--r-sm);
            font-size: .8rem;
            font-family: inherit;
        }

        .edit-form-actions {
            display: flex;
            gap: .3rem;
        }

        .edit-form-btn {
            flex: 1;
            padding: .3rem;
            border: none;
            border-radius: var(--r-sm);
            font-size: .7rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* ================================================================
           VALIDATION CLIENTS
        ================================================================ */
        .validation-config-content {
            padding: .75rem 1rem;
        }

        .fournisseur-form-group {
            margin-bottom: 1rem;
        }

        .fournisseur-select {
            width: 100%;
            padding: .5rem .7rem;
            border: 1px solid var(--c-border);
            border-radius: var(--r-md);
            font-size: .85rem;
            font-family: inherit;
            background: var(--c-surface);
        }

        .fournisseur-select:focus {
            border-color: var(--c-accent);
            outline: none;
        }

        .validation-client-card {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--r-md);
            margin-bottom: .5rem;
            transition: all .15s;
        }

        .validation-client-card:hover {
            border-color: var(--c-accent);
        }

        .validation-client-header {
            padding: .5rem .75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .validation-client-name {
            font-weight: 600;
            font-size: .85rem;
        }

        .validation-client-id {
            font-size: .65rem;
            color: var(--c-ink3);
        }

        .validation-client-badge {
            font-size: .65rem;
            background: var(--c-accent-lt);
            color: var(--c-accent);
            padding: .15rem .5rem;
            border-radius: 999px;
        }

        .validation-client-body {
            padding: .5rem .75rem .75rem;
            display: none;
            border-top: 1px solid var(--c-border);
        }

        .validation-client-body.expanded {
            display: block;
        }

        .validation-field-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: .3rem 0;
            border-bottom: 1px solid var(--c-border);
            font-size: .8rem;
        }

        .validation-field-row:last-child {
            border-bottom: none;
        }

        .validation-field-label {
            color: var(--c-ink2);
            display: flex;
            align-items: center;
            gap: .3rem;
        }

        .validation-field-value {
            font-weight: 500;
        }

        .type-selector {
            padding: .2rem .5rem;
            border: 1px solid var(--c-border);
            border-radius: var(--r-sm);
            font-size: .75rem;
            font-family: inherit;
            background: var(--c-surface);
            min-width: 120px;
        }

        .type-selector:focus {
            border-color: var(--c-accent);
            outline: none;
        }

        .date-input {
            padding: .2rem .5rem;
            border: 1px solid var(--c-border);
            border-radius: var(--r-sm);
            font-size: .75rem;
            font-family: inherit;
            background: var(--c-surface);
        }

        .date-input:focus {
            border-color: var(--c-accent);
            outline: none;
        }

        .btn-add-type {
            margin-top: .3rem;
            padding: .3rem .8rem;
            background: var(--c-accent);
            color: #fff;
            border: none;
            border-radius: var(--r-sm);
            font-size: .7rem;
            font-weight: 500;
            cursor: pointer;
            transition: all .15s;
            display: inline-flex;
            align-items: center;
            gap: .3rem;
        }

        .btn-add-type:hover {
            background: var(--c-accent-dk);
            transform: translateY(-1px);
        }

        .btn-add-type:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ================================================================
           BOUTON RETOUR FLOTTANT
        ================================================================ */
        .back-btn {
            position: fixed;
            bottom: 5.5rem;
            left: 1.25rem;
            z-index: 100;
        }

        .back-btn .btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
        }

        .back-btn .btn span {
            display: none;
        }

        .back-btn .btn i {
            margin: 0;
            font-size: 1.1rem;
        }

        /* ================================================================
           FAB
        ================================================================ */
        .fab {
            position: fixed;
            bottom: 5.5rem;
            right: 1.25rem;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--c-accent);
            color: #fff;
            border: none;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: var(--shadow-md);
            z-index: 100;
            transition: all .2s;
        }

        .fab:hover {
            transform: translateY(-2px) scale(1.1);
            background: var(--c-accent-dk);
        }

        .fab.visible {
            display: flex;
        }

        /* ================================================================
           CUSTOM CONFIRM
        ================================================================ */
        .custom-confirm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(26,25,22,.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 1rem;
        }

        .custom-confirm-overlay.active {
            display: flex;
        }

        .custom-confirm-modal {
            background: var(--c-surface);
            border-radius: var(--r-xl);
            max-width: 420px;
            width: 100%;
            overflow: hidden;
            animation: modalSlideIn .25s var(--ease);
            box-shadow: var(--shadow-lg);
        }

        .custom-confirm-header {
            padding: 1.25rem 1.25rem .5rem;
            display: flex;
            align-items: center;
            gap: .75rem;
        }

        .custom-confirm-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .custom-confirm-icon.warning {
            background: var(--c-amber-lt);
            color: var(--c-amber);
        }

        .custom-confirm-icon.danger {
            background: var(--c-red-lt);
            color: var(--c-red);
        }

        .custom-confirm-icon.info {
            background: var(--c-accent-lt);
            color: var(--c-accent);
        }

        .custom-confirm-icon.success {
            background: var(--c-green-lt);
            color: var(--c-green);
        }

        .custom-confirm-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .custom-confirm-message {
            padding: .25rem 1.25rem 1.25rem;
            color: var(--c-ink2);
            line-height: 1.5;
            white-space: pre-line;
            font-size: .85rem;
        }

        .custom-confirm-footer {
            padding: .75rem 1.25rem;
            display: flex;
            justify-content: flex-end;
            gap: .5rem;
            border-top: 1px solid var(--c-border);
            background: var(--c-bg);
        }

        .custom-confirm-btn {
            padding: .45rem 1rem;
            border-radius: var(--r-md);
            font-weight: 600;
            font-size: .8rem;
            cursor: pointer;
            transition: all .15s;
            border: none;
        }

        .custom-confirm-btn-cancel {
            background: var(--c-surface);
            color: var(--c-ink2);
            border: 1px solid var(--c-border);
        }

        .custom-confirm-btn-cancel:hover {
            background: var(--c-surface2);
        }

        .custom-confirm-btn-confirm {
            background: var(--c-accent);
            color: #fff;
        }

        .custom-confirm-btn-confirm.danger {
            background: var(--c-red);
        }

        .custom-confirm-btn-confirm:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        /* ================================================================
           LOADING OVERLAY
        ================================================================ */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,.85);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            flex-direction: column;
            gap: .75rem;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-overlay .spinner-border {
            width: 2.5rem;
            height: 2.5rem;
        }

        .loading-text {
            font-size: .9rem;
            font-weight: 500;
            color: var(--c-ink2);
        }

        /* ================================================================
           PRESCRIPTION TABLE (dans modale)
        ================================================================ */
        .prescription-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
            font-size: .85rem;
        }

        .prescription-table th {
            background: var(--c-accent-lt);
            padding: .5rem .6rem;
            text-align: center;
            font-size: .7rem;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--c-ink2);
            border-bottom: 1px solid var(--c-border);
        }

        .prescription-table td {
            padding: .4rem .6rem;
            text-align: center;
            border-bottom: 1px solid var(--c-border);
        }

        .prescription-select {
            padding: .2rem .3rem;
            border: 1px solid var(--c-border);
            border-radius: var(--r-sm);
            font-size: .8rem;
            font-family: inherit;

                font-size: .78rem;

                font-size: .7rem;
                padding: .4rem .6rem;

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;

        /* ================================================================

<body>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toast-container"></div>

    <!-- FAB SCROLL TOP -->
    <button class="fab" id="fab" onclick="scrollToTop()"><i class="fas fa-arrow-up"></i></button>

    <!-- BOUTON RETOUR FLOTTANT -->
    <div class="back-btn">
        <button class="btn btn-primary" onclick="openVueGlobale()">
            <i class="fas fa-arrow-left"></i><span>Retour</span>
        </button>
    </div>

    <!-- ============================================================
         CONTENU PRINCIPAL
    ============================================================ -->
    <div class="shell">

        <!-- TOPBAR -->
        <header class="topbar">
            <div class="topbar-brand">
                <div class="brand-mark">
                    <img src="logoAppli.png" alt="VisionPro" onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\'fas fa-eye\'></i>'">
                </div>
                <span class="brand-name">Visio<span>Pro</span></span>
            </div>
            <div class="topbar-right">
                <span class="topbar-date" id="current-date"></span>
                <span class="topbar-user" id="topbar-username">Admin</span>
                <img src="https://ui-avatars.com/api/?name=Admin&background=3D4FE0&color=fff&size=64" alt="Profil" class="avatar" id="user-avatar">
            </div>
        </header>

        <!-- CONTROLS -->
        <div class="controls-panel">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Rechercher par nom..." onkeyup="debounceSearch()">

            <div class="filters-group">
                <select class="filter-select" id="statusFilter" onchange="applyFilters()">
                    <option value="">Tous les statuts</option>
                </select>
                <select class="filter-select" id="agencyFilter" onchange="applyFilters()">

                </select>
                <button class="btn btn-secondary" onclick="refreshClients()">
                    <i class="fas fa-sync-alt"></i> Actualiser
